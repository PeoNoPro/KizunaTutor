# Chỉ dùng khi chạy profile admin-dev với PostgreSQL cục bộ riêng.
server.address=127.0.0.1
server.port=${SERVER_PORT:8085}
server.forward-headers-strategy=none
spring.datasource.url=${ADMIN_DEV_DB_URL:jdbc:postgresql://127.0.0.1:5433/kizuna_admin_dev}
spring.datasource.username=${ADMIN_DEV_DB_USERNAME:postgres}
spring.datasource.password=${ADMIN_DEV_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
app.dev-login.email=${ADMIN_DEV_EMAIL:}
app.frontend-origins=http://localhost:3000,http://127.0.0.1:3000
logging.level.root=INFO
logging.level.org.springframework=INFO
spring.devtools.restart.enabled=false
