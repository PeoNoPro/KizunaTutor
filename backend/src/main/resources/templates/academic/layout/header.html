<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="h-16 bg-white border-b border-teal-100 sticky top-0 z-40 px-4 sm:px-8 flex items-center justify-between shadow-xs">
    <!-- Nạp script xác thực và xử lý đăng xuất toàn cục -->
    <script th:src="@{/js/globalAuth.js}"></script>

    <div class="flex items-center gap-3 sm:gap-6">
        <button type="button" class="md:hidden p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100" onclick="toggleSidebar()">
            ☰
        </button>
        <a th:href="@{/academic/dashboard}" class="flex items-center gap-2.5 no-underline group" title="KizunaTutor Học Vụ">
            <div class="w-8 h-8 rounded-lg bg-teal-700 text-white font-bold flex items-center justify-center font-serif text-base shadow-xs group-hover:bg-teal-800 transition-colors">
                絆
            </div>
            <div class="font-extrabold text-lg text-slate-900 tracking-tight">
                Kizuna<span class="text-teal-700">Academic</span>
            </div>
        </a>
    </div>

    <div class="hidden sm:flex items-center gap-2 text-xs font-medium text-slate-500">
        <a th:href="@{/academic/dashboard}" class="hover:text-slate-800 transition-colors">Không Gian Học Vụ</a>
        <span>/</span>
        <span class="text-slate-400">Khảo Thí &amp; Giáo Trình</span>
        <span>/</span>
        <span class="text-teal-800 font-semibold" th:text="${breadcrumbSection != null ? breadcrumbSection : 'Tổng Quan'}">Tổng Quan</span>
    </div>
</header>
</html>
