<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- HEADER TINH GỌN (CHỈ DÀNH CHO MOBILE ĐỂ MỞ MENU, ẨN HOÀN TOÀN TRÊN DESKTOP ĐỂ TIẾT KIỆM KHÔNG GIAN) -->
<header th:fragment="header" class="md:hidden h-11 bg-white border-b border-[#E2E8F0] sticky top-0 z-40 px-3 flex items-center justify-between font-sans">
    <!-- Nạp script cấu hình Tailwind và Xác thực toàn cục -->
    <script th:src="@{/js/shared/tailwind-nhai-config.js}"></script>
    <script th:src="@{/js/globalAuth.js}"></script>
    <script th:src="@{/js/shared/kizunaDialog.js}"></script>

    <div class="flex items-center gap-2">
        <button type="button" class="p-1.5 rounded-lg border border-[#CBD5E1] text-[#475569] bg-white hover:bg-slate-50 shadow-sm" onclick="toggleSidebar()" title="Mở danh mục menu">
            ☰
        </button>
        <span class="font-brand font-bold text-sm text-[#0F172A]">Kizuna<span class="text-[#2563EB]">Learner</span></span>
    </div>
</header>
</html>
