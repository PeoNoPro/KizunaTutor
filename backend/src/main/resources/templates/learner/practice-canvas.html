<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phòng Luyện Viết Shodo Canvas AI - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">

  <!-- Tailwind & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Single Source of Truth CSS -->
  <link rel="stylesheet" href="/assets/css/learning-support-common.css">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/utilities.css">

  <style>
    /* Bảng Canvas Shodo: Cố định kích thước chuẩn vuông, không co giãn làm méo nét vẽ */
    .canvas-board-wrapper {
      position: relative;
      width: 340px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      background-color: var(--color-text-white);
      border: 1px solid var(--color-border-solid);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 2px 2px 0px 0px var(--color-border-solid);
      flex-shrink: 0;
      margin: 0 auto;
    }

    #practiceBoard {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
      z-index: 10;
    }

    #canvasGuidelineSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      will-change: stroke-dashoffset;
    }

    .ksp-anim-path {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .shodo-grid-line {
      stroke: #CBD5E1;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }

    .shodo-grid-center {
      stroke: #94A3B8;
      stroke-width: 1.2;
      stroke-dasharray: 6 4;
    }

    .stroke-step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border-solid);
      background-color: var(--color-text-white);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 1px 1px 0px 0px var(--color-border-solid);
      transition: var(--duration-fast);
    }
    .stroke-step-badge:hover {
      background-color: var(--color-bg-amber);
    }
    .stroke-step-badge.active {
      background-color: var(--color-accent-pink) !important;
      color: var(--color-text-white) !important;
    }
  </style>
</head>
<body class="learning-support-body antialiased selection:bg-[#E0399A] selection:text-white">
  <div class="flex h-screen overflow-hidden">

    <!-- 1. SIDEBAR DÙNG CHUNG CHO HỌC VIÊN -->
    <div id="learnerSidebarContainer"></div>

    <!-- 2. MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      
      <!-- HEADER DÙNG CHUNG CHO HỌC VIÊN -->
      <div id="learnerHeaderContainer"></div>

      <!-- Scrollable Main Container -->
      <main class="flex-1 overflow-y-auto p-3 sm:p-4 w-full max-w-6xl mx-auto space-y-4">
        
        <!-- Main Layout: 2 Columns (Canvas Area 5/12 + Details & Tools 7/12) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start w-full min-w-0">
          
          <!-- ==================== CỘT 1: KHUNG VẼ CANVAS Ô MỄ ==================== -->
          <div class="lg:col-span-5 ls-card flex flex-col items-center space-y-3 min-w-0 w-full">
            
            <!-- Thông tin chữ đang chọn trên Canvas -->
            <div class="w-full flex items-center justify-between pb-2 border-b border-[#0F172A]/20">
              <div class="flex items-center gap-2">
                <span class="ls-badge ls-badge-jlpt">Kanji</span>
                <span id="canvasActiveChar" class="text-2xl font-bold text-[#0F172A] font-serif leading-none">—</span>
                <span id="canvasActiveHanViet" class="text-xs font-semibold text-[#707881]">(Chưa chọn chữ)</span>
              </div>

              <div class="flex items-center gap-1.5">
                <span id="strokeCountBadge" class="ls-badge bg-[#FEF3C7] text-[#0F172A]">
                  0 nét
                </span>
              </div>
            </div>

            <!-- Khung Canvas Ô Mễ Tỷ Lệ 1:1 Cố Định Chống Reflow -->
            <div class="shodo-canvas-box canvas-board-wrapper relative w-full max-w-[420px] aspect-square mx-auto bg-[#FAF8F2] border-2 border-[#0F172A] rounded-[8px] shadow-[3px_3px_0px_0px_#0F172A] overflow-hidden select-none" id="canvasWrapper">
              <!-- Lưới Ô Mễ SVG tĩnh (Background) -->
              <svg class="absolute inset-0 w-full h-full pointer-events-none select-none z-0" viewBox="0 0 300 300">
                <line x1="0" y1="0" x2="300" y2="300" class="shodo-grid-line" />
                <line x1="300" y1="0" x2="0" y2="300" class="shodo-grid-line" />
                <line x1="150" y1="0" x2="150" y2="300" class="shodo-grid-center" />
                <line x1="0" y1="150" x2="300" y2="150" class="shodo-grid-center" />
              </svg>

              <!-- Lớp SVG Nét Hoạt Ảnh Bút Thuận & Guideline (Layer 2) -->
              <svg id="canvasGuidelineSvg" class="absolute inset-0 w-full h-full pointer-events-none z-10 transition-opacity duration-150" viewBox="0 0 109 109"></svg>

              <!-- Lớp Canvas 2D Học Viên Vẽ Tay (Layer 3) -->
              <canvas id="practiceBoard" class="absolute inset-0 w-full h-full z-20 cursor-crosshair touch-none"></canvas>
            </div>

            <!-- Thanh Công Cụ Điều Khiển Nét Vẽ (Toolbar Cùng 1 Hàng Gọn Gàng) -->
            <div class="shodo-toolbar w-full grid grid-cols-4 gap-1.5 p-1.5 bg-white border border-[#0F172A] rounded-[6px] shadow-[2px_2px_0px_0px_#0F172A]">
              <button type="button" id="btnPlayStroke" data-action="play-stroke"
                      class="ls-btn ls-btn-default w-full h-[32px] !p-0 flex items-center justify-center gap-1 text-[11px] font-bold border border-[#0F172A] rounded-[4px] shadow-[1px_1px_0px_0px_#0F172A] transition"
                      title="Phát hoạt ảnh mô phỏng thứ tự từng nét chuẩn">
                <span class="icon text-[11px] shrink-0">▷</span>
                <span class="label whitespace-nowrap">Phát nét</span>
              </button>

              <button type="button" id="btnToggleGuide" data-action="toggle-ghost"
                      class="ls-btn ls-btn-default is-active bg-[#FFE5EC] text-[#831843] w-full h-[32px] !p-0 flex items-center justify-center gap-1 text-[11px] font-bold border border-[#0F172A] rounded-[4px] shadow-[1px_1px_0px_0px_#0F172A] transition"
                      title="Nhấn để ẩn nét mờ hướng dẫn">
                <span class="icon text-[11px] shrink-0">👁️</span>
                <span class="label whitespace-nowrap">Ẩn nét mờ</span>
              </button>

              <button type="button" id="btnUndoStroke" 
                      class="ls-btn ls-btn-default w-full h-[32px] !p-0 flex items-center justify-center gap-1 text-[11px] font-bold border border-[#0F172A] rounded-[4px] shadow-[1px_1px_0px_0px_#0F172A] transition"
                      title="Quay lại một nét vừa vẽ">
                <span class="icon text-[11px] shrink-0">↩️</span>
                <span class="label whitespace-nowrap">Hoàn tác</span>
              </button>

              <button type="button" id="btnClearBoard" 
                      class="ls-btn ls-btn-danger w-full h-[32px] !p-0 flex items-center justify-center gap-1 text-[11px] font-bold border border-[#0F172A] rounded-[4px] shadow-[1px_1px_0px_0px_#0F172A] transition"
                      title="Xóa trắng bảng vẽ để luyện lại từ đầu">
                <span class="icon text-[11px] shrink-0">🗑️</span>
                <span class="label whitespace-nowrap">Xóa hết</span>
              </button>
            </div>

            <!-- Nút Chấm Điểm AI Sensei -->
          </div>

          <!-- ==================== CỘT 2: CHI TIẾT HÁN TỰ & CÔNG CỤ ==================== -->
          <div class="lg:col-span-7 space-y-4 min-w-0 w-full">
            
            <!-- Hộp Tìm / Đổi Chữ Nhanh -->
            <div class="ls-card space-y-2">
              <label for="inputQuickChar" class="block text-xs font-bold text-[#0F172A] uppercase tracking-wider">
                Luyện viết chữ Hán bất kỳ:
              </label>
              <div class="flex items-center gap-2">
                <input type="text" id="inputQuickChar" placeholder="Nhập một chữ Hán (ví dụ: 心, 道, 学, 和, 絆...)" 
                       maxlength="5"
                       class="ls-input flex-1">
                <button type="button" id="btnLoadChar" class="ls-btn ls-btn-primary">
                  Nạp Chữ
                </button>
              </div>
            </div>

            <!-- Bảng Chi Tiết Thông Tin Chữ Hán -->
            <div class="ls-card space-y-3">
              <div class="flex items-center justify-between border-b border-[#0F172A]/20 pb-2.5 flex-wrap gap-2">
                <h3 class="font-bold text-sm text-[#0F172A] flex items-center gap-1.5">
                  <span class="material-symbols-outlined text-[18px] text-[#006194]">menu_book</span>
                  <span>Thông Tin Tra Cứu Chữ Hán</span>
                </h3>
                <div class="flex items-center gap-1.5">
                  <span id="kanjiJlptLevel" class="ls-badge ls-badge-jlpt">
                    Chưa chọn chữ
                  </span>
                  <span id="kanjiStrokeBadge" class="ls-badge bg-[#FEF3C7] text-[#0F172A]">
                    0 nét
                  </span>
                  <!-- Alias ID cho test suite -->
                  <span id="kanjiJlptBadge" class="hidden"></span>
                  <span id="kanjiDisplayChar" class="hidden"></span>
                </div>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                <div class="p-2.5 bg-[#FEF3C7] border border-[#0F172A] rounded-[6px]">
                  <div class="text-[10px] text-[#707881] font-semibold">Âm Hán Việt</div>
                  <div id="detailHanViet" class="font-bold text-sm text-[#831843] mt-0.5 uppercase tracking-wide">—</div>
                  <span id="kanjiHanViet" class="hidden"></span>
                  <span id="panelHanViet" class="hidden"></span>
                </div>
                <div class="p-2.5 bg-[#FEF3C7] border border-[#0F172A] rounded-[6px]">
                  <div class="text-[10px] text-[#707881] font-semibold">Bộ thủ chính</div>
                  <div id="detailRadical" class="font-bold text-sm text-[#0F172A] mt-0.5 font-serif">—</div>
                  <span id="kanjiRadical" class="hidden"></span>
                  <span id="panelRadical" class="hidden"></span>
                </div>
                <div class="p-2.5 bg-[#FEF3C7] border border-[#0F172A] rounded-[6px] col-span-2 sm:col-span-1">
                  <div class="text-[10px] text-[#707881] font-semibold">Số nét chuẩn</div>
                  <div id="detailStrokeCount" class="font-bold text-sm text-[#0F172A] mt-0.5 font-mono">—</div>
                  <span id="panelStrokeCount" class="hidden"></span>
                </div>
                <div class="p-2.5 bg-[#FEF3C7] border border-[#0F172A] rounded-[6px]">
                  <div class="text-[10px] text-[#707881] font-semibold">Âm Onyomi</div>
                  <div id="detailOnyomi" class="font-bold text-xs text-[#006194] mt-0.5 font-mono">—</div>
                  <span id="kanjiOnyomi" class="hidden"></span>
                  <span id="panelOnyomi" class="hidden"></span>
                </div>
                <div class="p-2.5 bg-[#FEF3C7] border border-[#0F172A] rounded-[6px] col-span-2">
                  <div class="text-[10px] text-[#707881] font-semibold">Âm Kunyomi</div>
                  <div id="detailKunyomi" class="font-bold text-xs text-[#831843] mt-0.5 font-mono">—</div>
                  <span id="kanjiKunyomi" class="hidden"></span>
                  <span id="panelKunyomi" class="hidden"></span>
                </div>
              </div>

              <!-- Khối giải nghĩa đầy đủ không bị cắt cụt -->
              <div class="p-2.5 bg-[#FEF3C7] border border-[#0F172A] rounded-[6px]">
                <div class="text-[10px] text-[#707881] font-semibold mb-1">Nghĩa tiếng Việt chi tiết:</div>
                <p id="detailMeaning" class="text-xs text-[#0F172A] leading-relaxed font-sans m-0 font-medium">—</p>
                <span id="kanjiMeaning" class="hidden"></span>
                <span id="panelMeaning" class="hidden"></span>
              </div>

              <!-- Khay Xem Từng Nét Riêng Biệt (Step By Step Strokes) -->
              <div class="space-y-2 pt-1">
                <div class="flex items-center justify-between text-xs font-semibold text-[#0F172A]">
                  <span>Thứ tự nét (nhấn số nét để xem riêng nét):</span>
                  <span id="activeStrokeLabel" class="text-[#006194] font-bold">Tất cả nét</span>
                </div>
                <div class="flex items-center gap-1.5 flex-wrap" id="strokeStepsContainer">
                  <!-- Render tự động bởi shodo-practice.js -->
                </div>
              </div>
            </div>


          </div>
        </div>

        <div id="learnerFooterContainer"></div>
      </main>
    </div>
  </div>

  <!-- ==================== MODAL CẤT VÀO BỘ THẺ ==================== -->
  <div id="modalAddToDeck" style="display: none;" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="ls-card max-w-sm w-full p-5 space-y-3 text-xs">
      <div class="flex items-center justify-between pb-2 border-b border-[#0F172A]/20">
        <h3 class="text-sm font-bold text-[#0F172A]">Cất Chữ Vào Bộ Thẻ Cá Nhân</h3>
        <button type="button" id="btnCloseDeckModal" class="text-[#707881] hover:text-[#0F172A] font-bold p-1 text-sm transition cursor-pointer">✕</button>
      </div>

      <div class="text-center py-3 bg-[#FEF3C7] border border-[#0F172A] rounded-[6px]">
        <div id="modalDeckChar" class="font-serif text-4xl font-extrabold text-[#831843]">未</div>
        <div id="modalDeckHanViet" class="text-xs font-bold text-[#0F172A] mt-1 uppercase tracking-wider">VỊ</div>
      </div>

      <form id="formSaveToDeck" class="space-y-3">
        <input type="hidden" id="modalDeckCharInput">
        <div>
          <label class="block font-bold text-[#0F172A] mb-1">Chọn Thư Mục / Bộ Thẻ:</label>
          <select id="modalDeckSelect" class="ls-input w-full">
            <option value="">Đang tải danh sách bộ thẻ...</option>
          </select>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2 border-t border-[#0F172A]/20">
          <button type="button" id="btnCancelDeckModal" class="ls-btn ls-btn-default">Hủy Bỏ</button>
          <button type="submit" id="btnConfirmSaveDeck" class="ls-btn ls-btn-primary">Cất Vào Thẻ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/components/learner-layout/learner-layout.js"></script>
  <script type="module" src="/pages/shodo-practice/shodo-practice.js"></script>
</body>
</html>
