# Profile kiem thu tich hop tuy chon cho FE-03 (Tutor Verification).
# Chi kich hoat khi co bien moi truong VERIFICATION_TEST_DB_URL tro toi DB kiem thu rieng.
# KHONG dat bien nay tro toi DB Supabase dung chung.
spring.datasource.url=${VERIFICATION_TEST_DB_URL}
spring.datasource.username=${VERIFICATION_TEST_DB_USER:postgres}
spring.datasource.password=${VERIFICATION_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none

app.seeder.kanji.enabled=false
app.seeder.excel-kanji.enabled=false
app.seeder.excel-vocab.enabled=false

app.verification.storage-dir=${java.io.tmpdir}/kizuna-verification-test
