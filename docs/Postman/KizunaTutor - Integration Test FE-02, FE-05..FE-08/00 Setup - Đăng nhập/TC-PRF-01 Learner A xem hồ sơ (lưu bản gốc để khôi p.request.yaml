$kind: http-request
name: TC-PRF-01 Learner A xem hồ sơ (lưu bản gốc để khôi phục)
description: ""
url: "{{baseUrl}}/api/profile/learner/me"
method: GET
headers:
  Authorization: Bearer {{learnerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("email đúng tài khoản", () => pm.expect(pm.response.json().data.email.toLowerCase()).to.eql(pm.environment.get('learnerEmail').toLowerCase()));
      if (pm.response.code < 300) { pm.environment.set("learnerProfileOriginal", JSON.stringify(pm.response.json().data)); }
      if (!pm.environment.get('learnerPhone') && pm.response.json().data.phone) pm.environment.set('learnerPhone', pm.response.json().data.phone);
    language: text/javascript
order: 7000
