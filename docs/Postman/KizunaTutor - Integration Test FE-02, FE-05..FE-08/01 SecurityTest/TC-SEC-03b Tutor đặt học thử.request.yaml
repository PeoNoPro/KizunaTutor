$kind: http-request
description: ""
url: "{{baseUrl}}/api/trial-bookings"
method: POST
headers:
  Authorization: Bearer {{tutorToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tutorId": "{{tutorId}}",
      "scheduledStartTime": "{{nextMonday}}T18:00:00+07:00",
      "contactPhone": "{{learnerPhone}}",
      "contactEmail": "{{learnerEmail}}",
      "shareContact": true,
      "learningGoals": "Luyện thi JLPT N3",
      "initialMessage": "Em muốn học thử ạ."
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403", () => pm.expect(pm.response.code).to.be.oneOf([403]));
    language: text/javascript
order: 7000
