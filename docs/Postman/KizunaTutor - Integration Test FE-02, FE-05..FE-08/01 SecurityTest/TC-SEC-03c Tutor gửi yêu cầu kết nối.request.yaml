$kind: http-request
description: ""
url: "{{baseUrl}}/api/connection-requests"
method: POST
headers:
  Authorization: Bearer {{tutorToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tutorId": "{{tutorId}}",
      "learningMode": "{{tutorLearningMode}}",
      "slots": [
        {
          "dayOfWeek": 2,
          "startTime": "18:00"
        }
      ],
      "contactPhone": "{{learnerPhone}}",
      "contactEmail": "{{learnerEmail}}",
      "shareContact": true,
      "learningGoals": "Học giao tiếp hằng tuần"
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403", () => pm.expect(pm.response.code).to.be.oneOf([403]));
    language: text/javascript
order: 8000
