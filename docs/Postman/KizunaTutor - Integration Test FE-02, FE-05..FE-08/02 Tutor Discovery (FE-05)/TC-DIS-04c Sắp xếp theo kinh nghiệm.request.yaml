$kind: http-request
description: ""
url: "{{baseUrl}}/api/tutors?sortBy=exp&size=20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      const c = pm.response.json().content; pm.test("kinh nghiệm giảm dần", () => { for (let i = 1; i < c.length; i++) pm.expect(c[i].experienceYears || 0).to.be.at.most(c[i-1].experienceYears || 0); });
    language: text/javascript
order: 5000
