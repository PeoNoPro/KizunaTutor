$kind: http-request
description: ""
url: "{{baseUrl}}/api/tutors/{{tutorId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("đúng Tutor A", () => pm.expect(pm.response.json().tutorId).to.eql(pm.environment.get('tutorId')));
      pm.test("location chỉ có tỉnh/quận (không số nhà)", () => pm.expect(String(pm.response.json().location || '')).to.not.match(/\d+\s+\S/));
    language: text/javascript
order: 8000
