$kind: http-request
description: ""
url: "{{baseUrl}}/api/profile/learner/me"
method: PUT
headers:
  Authorization: Bearer {{learnerToken}}
  Content-Type: application/json
body:
  type: text
  content: "{{body}}"
scripts:
  - type: beforeRequest
    code: |-
      const o = JSON.parse(pm.environment.get('learnerProfileOriginal'));
      const b = { fullName: o.fullName, phone: o.phone, avatarUrl: o.avatarUrl, currentLevel: o.currentLevel || 'N5', targetLevel: o.targetLevel || 'N3', learningGoals: o.learningGoals, province: o.province, address: o.address };
      Object.assign(b, { phone: pm.environment.get('learner2Phone') });
      pm.variables.set('body', JSON.stringify(b));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 409", () => pm.expect(pm.response.code).to.be.oneOf([409]));
      pm.test("Thông báo: Số điện thoại này đã được liên kết với một tài khoản khác trong hệ thống.", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("Số điện thoại này đã được liên kết với một tài khoản khác trong hệ thống."); });
    language: text/javascript
order: 3000
