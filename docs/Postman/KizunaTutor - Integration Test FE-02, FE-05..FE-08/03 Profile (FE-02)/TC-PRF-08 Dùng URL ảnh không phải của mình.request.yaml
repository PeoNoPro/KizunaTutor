$kind: http-request
description: ""
url: "{{baseUrl}}/api/profile/learner/me"
method: PUT
headers:
  Authorization: Bearer {{learnerToken}}
  Content-Type: application/json
body:
  type: text
  content: "{{body}}"
scripts:
  - type: beforeRequest
    code: |-
      const o = JSON.parse(pm.environment.get('learnerProfileOriginal'));
      const b = { fullName: o.fullName, phone: o.phone, avatarUrl: o.avatarUrl, currentLevel: o.currentLevel || 'N5', targetLevel: o.targetLevel || 'N3', learningGoals: o.learningGoals, province: o.province, address: o.address };
      Object.assign(b, { avatarUrl: '/api/profile/avatar/' + pm.environment.get('learner2Id') + '_00000000-0000-4000-8000-000000000000.jpg' });
      pm.variables.set('body', JSON.stringify(b));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.expect(pm.response.code).to.be.oneOf([400]));
      pm.test("Thông báo: Ảnh đại diện chỉ nhận ảnh tải lên từ máy của bạn.", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("Ảnh đại diện chỉ nhận ảnh tải lên từ máy của bạn."); });
    language: text/javascript
order: 4000
