$kind: http-request
description: ""
url: "{{baseUrl}}/api/profile/tutor/me"
method: PUT
headers:
  Authorization: Bearer {{tutorToken}}
  Content-Type: application/json
body:
  type: text
  content: "{{body}}"
scripts:
  - type: beforeRequest
    code: |-
      const o = JSON.parse(pm.environment.get('tutorProfile'));
      const b = { fullName: o.fullName, phone: o.phone, avatarUrl: o.avatarUrl, headline: o.headline, bio: o.bio, experienceYears: o.experienceYears, hourlyRate: o.hourlyRate, highestJlptLevel: o.highestJlptLevel, province: o.province, addressDetail: o.addressDetail };
      Object.assign(b, { province: 'Paris' });
      pm.variables.set('body', JSON.stringify(b));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.expect(pm.response.code).to.be.oneOf([400]));
      pm.test("Thông báo: Tỉnh/Thành phố không nằm trong danh sách hỗ trợ.", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("Tỉnh/Thành phố không nằm trong danh sách hỗ trợ."); });
    language: text/javascript
order: 5000
