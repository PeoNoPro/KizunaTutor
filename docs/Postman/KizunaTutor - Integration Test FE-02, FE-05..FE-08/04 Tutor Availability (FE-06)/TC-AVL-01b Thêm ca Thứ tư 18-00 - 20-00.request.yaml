$kind: http-request
name: TC-AVL-01b Thêm ca Thứ tư 18:00 - 20:00
description: ""
url: "{{baseUrl}}/api/tutor/availability"
method: POST
headers:
  Authorization: Bearer {{tutorToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dayOfWeek": 4,
      "startTime": "18:00",
      "endTime": "20:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200/201", () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      if (pm.response.code < 300) { pm.environment.set("availWedId", pm.response.json().data.availabilityId); }
      if (pm.response.code === 409) pm.sendRequest({ url: pm.environment.get('baseUrl') + '/api/tutor/availability', header: { Authorization: 'Bearer ' + pm.environment.get('tutorToken') } }, (e, r) => { const a = r.json().data.find(x => x.dayOfWeek === 4 && x.startTime === '18:00'); if (a) pm.environment.set('availWedId', a.availabilityId); });
    language: text/javascript
order: 2000
