$kind: http-request
name: TC-AVL-01c Lịch công khai tuần sau có 18:00 - 20:00 Thứ hai
description: ""
url: "{{baseUrl}}/api/tutors/{{tutorId}}/weekly-schedule?weekStart={{nextMonday}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("Thứ hai có khoảng rảnh 18:00 - 20:00", () => { const d = pm.response.json().days.find(x => x.date === pm.environment.get('nextMonday')); pm.expect(d.freeRanges.some(r => r.startTime <= '18:00' && r.endTime >= '20:00')).to.be.true; });
    language: text/javascript
order: 3000
