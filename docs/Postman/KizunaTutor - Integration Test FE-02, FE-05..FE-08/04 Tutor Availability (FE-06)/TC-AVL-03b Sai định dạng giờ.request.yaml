$kind: http-request
description: ""
url: "{{baseUrl}}/api/tutor/availability"
method: POST
headers:
  Authorization: Bearer {{tutorToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dayOfWeek": 7,
      "startTime": "6pm",
      "endTime": "20:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.expect(pm.response.code).to.be.oneOf([400]));
      pm.test("Thông báo: Giờ bắt đầu không đúng định dạng HH:mm", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("Giờ bắt đầu không đúng định dạng HH:mm"); });
    language: text/javascript
order: 6000
