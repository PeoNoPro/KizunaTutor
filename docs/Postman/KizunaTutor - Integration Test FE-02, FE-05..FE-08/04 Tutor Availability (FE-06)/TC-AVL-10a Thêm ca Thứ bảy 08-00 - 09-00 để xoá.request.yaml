$kind: http-request
name: TC-AVL-10a Thêm ca Thứ bảy 08:00 - 09:00 để xoá
description: ""
url: "{{baseUrl}}/api/tutor/availability"
method: POST
headers:
  Authorization: Bearer {{tutorToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dayOfWeek": 7,
      "startTime": "08:00",
      "endTime": "09:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200/201", () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      if (pm.response.code < 300) { pm.environment.set("availSatId", pm.response.json().data.availabilityId); }
    language: text/javascript
order: 16000
