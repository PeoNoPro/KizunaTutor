$kind: http-request
description: ""
url: "{{baseUrl}}/api/trial-bookings/my-requests"
method: GET
headers:
  Authorization: Bearer {{tutorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      const b = pm.response.json().data.items.find(x => x.bookingId === pm.environment.get('bookingId')); pm.test("có booking", () => pm.expect(b).to.exist); pm.test("thấy email learner", () => pm.expect(String(b.partnerEmail).toLowerCase()).to.eql(pm.environment.get('learnerEmail').toLowerCase()));
    language: text/javascript
order: 7000
