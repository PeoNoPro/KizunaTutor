$kind: http-request
description: ""
url: "{{baseUrl}}/api/trial-bookings"
method: POST
headers:
  Authorization: Bearer {{learnerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tutorId": "{{tutorId}}",
      "scheduledStartTime": "{{nextMonday}}T18:00:00+07:00",
      "contactPhone": "12345",
      "contactEmail": "{{learnerEmail}}",
      "shareContact": true,
      "learningGoals": "Luyện thi JLPT N3",
      "initialMessage": "Em muốn học thử ạ."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.expect(pm.response.code).to.be.oneOf([400]));
      pm.test("Thông báo: Số điện thoại không hợp lệ. Vui lòng nhập 10 số, bắt đầu bằng 0.", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("Số điện thoại không hợp lệ. Vui lòng nhập 10 số, bắt đầu bằng 0."); });
    language: text/javascript
order: 2000
