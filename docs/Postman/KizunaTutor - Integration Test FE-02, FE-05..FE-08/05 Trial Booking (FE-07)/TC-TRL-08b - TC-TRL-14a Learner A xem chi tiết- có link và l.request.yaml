$kind: http-request
name: "TC-TRL-08b / TC-TRL-14a Learner A xem chi tiết: có link và liên hệ tutor"
description: ""
url: "{{baseUrl}}/api/trial-bookings/{{bookingId}}"
method: GET
headers:
  Authorization: Bearer {{learnerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("pm.response.json().data.bookingStatus = CONFIRMED", () => pm.expect(pm.response.json().data.bookingStatus).to.eql("CONFIRMED"));
      pm.test("pm.response.json().data.meetingLink = https://meet.google.com/abc-defg-hij", () => pm.expect(pm.response.json().data.meetingLink).to.eql("https://meet.google.com/abc-defg-hij"));
      pm.test("đã thấy email tutor", () => pm.expect(String(pm.response.json().data.partnerEmail).toLowerCase()).to.eql(pm.environment.get('tutorEmail').toLowerCase()));
    language: text/javascript
order: 12000
