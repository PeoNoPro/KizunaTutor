$kind: http-request
name: TC-TRL-11a Learner A đặt lại Thứ hai 18:00
description: ""
url: "{{baseUrl}}/api/trial-bookings"
method: POST
headers:
  Authorization: Bearer {{learnerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tutorId": "{{tutorId}}",
      "scheduledStartTime": "{{nextMonday}}T18:00:00+07:00",
      "contactPhone": "{{learnerPhone}}",
      "contactEmail": "{{learnerEmail}}",
      "shareContact": true,
      "learningGoals": "Luyện thi JLPT N3",
      "initialMessage": "Em muốn học thử ạ."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200/201", () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      if (pm.response.code < 300) { pm.environment.set("bookingId", pm.response.json().data.bookingId); }
    language: text/javascript
order: 24000
