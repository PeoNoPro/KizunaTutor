$kind: http-request
name: TC-TRL-15 Learner A dời lịch sang Thứ tư 18:00
description: ""
url: "{{baseUrl}}/api/trial-bookings/{{bookingId}}/reschedule"
method: PUT
headers:
  Authorization: Bearer {{learnerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "newScheduledStartTime": "{{nextWednesday}}T18:00:00+07:00",
      "rescheduleReason": "Bận việc đột xuất"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("pm.response.json().data.bookingStatus = PENDING", () => pm.expect(pm.response.json().data.bookingStatus).to.eql("PENDING"));
    language: text/javascript
order: 21000
