$kind: http-request
description: ""
url: "{{baseUrl}}/api/trial-bookings/{{bookingId}}/cancel"
method: PUT
headers:
  Authorization: Bearer {{learnerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cancelReason": "Changed plan"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("pm.response.json().data.bookingStatus = CANCELLED", () => pm.expect(pm.response.json().data.bookingStatus).to.eql("CANCELLED"));
    language: text/javascript
order: 22000
