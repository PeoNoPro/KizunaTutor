$kind: http-request
description: ""
url: "{{baseUrl}}/api/tutor/availability/{{availMonId}}"
method: DELETE
headers:
  Authorization: Bearer {{tutorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 409", () => pm.expect(pm.response.code).to.be.oneOf([409]));
      pm.test("Thông báo: vì đang có học viên học hoặc chờ bạn duyệt", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("vì đang có học viên học hoặc chờ bạn duyệt"); });
    language: text/javascript
order: 17000
