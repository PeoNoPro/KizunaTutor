$kind: http-request
name: TC-CON-04a Giờ ngoài lịch rảnh (Chủ nhật 06:00)
description: ""
url: "{{baseUrl}}/api/connection-requests"
method: POST
headers:
  Authorization: Bearer {{learner2Token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tutorId": "{{tutorId}}",
      "learningMode": "{{tutorLearningMode}}",
      "slots": [
        {
          "dayOfWeek": 1,
          "startTime": "06:00"
        }
      ],
      "contactPhone": "{{learner2Phone}}",
      "contactEmail": "{{learner2Email}}",
      "shareContact": true,
      "learningGoals": "Học giao tiếp hằng tuần"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.expect(pm.response.code).to.be.oneOf([400]));
      pm.test("Thông báo: Giờ Chủ nhật 06:00 nằm ngoài lịch rảnh của gia sư.", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("Giờ Chủ nhật 06:00 nằm ngoài lịch rảnh của gia sư."); });
    language: text/javascript
order: 1000
