$kind: http-request
description: ""
url: "{{baseUrl}}/api/connection-requests/{{requestId}}/respond"
method: PUT
headers:
  Authorization: Bearer {{tutorToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "action": "ACCEPT",
      "message": "Hẹn gặp em",
      "slotDurations": [
        {
          "slotId": "{{slotMonId}}",
          "durationMinutes": 60
        },
        {
          "slotId": "{{slotWedId}}",
          "durationMinutes": 90
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("pm.response.json().data.status = ACCEPTED", () => pm.expect(pm.response.json().data.status).to.eql("ACCEPTED"));
      pm.test("giờ kết thúc 19:00 và 19:30", () => { const s = pm.response.json().data.slots; pm.expect(s.find(x => x.dayOfWeek === 2).endTime).to.eql('19:00'); pm.expect(s.find(x => x.dayOfWeek === 4).endTime).to.eql('19:30'); });
    language: text/javascript
order: 13000
