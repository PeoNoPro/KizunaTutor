$kind: http-request
description: ""
url: "{{baseUrl}}/api/connection-requests/{{requestId}}/cancel"
method: PUT
headers:
  Authorization: Bearer {{learner2Token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 403", () => pm.expect(pm.response.code).to.be.oneOf([403]));
      pm.test("Thông báo: Bạn không có quyền hủy yêu cầu kết nối này", () => { const j = pm.response.json(); const all = [j.message].concat((j.fieldErrors || []).map(f => f.message)).join(' | '); pm.expect(all).to.include("Bạn không có quyền hủy yêu cầu kết nối này"); });
    language: text/javascript
order: 9000
