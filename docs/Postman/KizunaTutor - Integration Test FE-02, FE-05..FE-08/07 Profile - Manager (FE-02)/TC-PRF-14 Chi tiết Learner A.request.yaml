$kind: http-request
description: ""
url: "{{baseUrl}}/api/profile/users/{{learnerId}}"
method: GET
headers:
  Authorization: Bearer {{managerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("đúng learner", () => pm.expect(pm.response.json().data.userId || pm.response.json().data.id).to.eql(pm.environment.get('learnerId')));
    language: text/javascript
order: 2000
