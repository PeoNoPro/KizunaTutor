<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ cá nhân - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/components/tutor-layout/tailwind-theme.js"></script>
  <link rel="stylesheet" href="/styles/tutor-theme.css">
</head>
<body class="bg-surface font-sans text-body-md text-on-surface antialiased">

  <div id="academicSidebar"></div>

  <div class="lg:pl-72 flex flex-col min-h-screen">
    <div id="academicTopbar"></div>

    <main class="flex-1 pt-16 lg:pt-0 w-full">
      <div class="px-4 md:px-8 py-8 w-full flex flex-col gap-6">

        <!-- Tiêu đề -->
        <div class="flex flex-col gap-1">
          <h1 class="text-headline-lg text-on-surface font-bold tracking-tight">Hồ sơ cá nhân</h1>
          <p class="text-body-md text-on-surface-variant">Xem và cập nhật thông tin tài khoản của bạn.</p>
        </div>

        <!-- Đang tải / lỗi -->
        <div id="loadingState" class="tv-skeleton h-80 rounded-2xl" aria-live="polite"></div>
        <section id="errorState" class="hidden bg-surface-container-lowest rounded-2xl p-8 shadow-sm text-center">
          <span class="material-symbols-outlined text-5xl text-error">cloud_off</span>
          <h2 class="text-headline-sm mt-2">Chưa tải được hồ sơ cá nhân</h2>
          <p id="errorMessage" class="text-on-surface-variant mt-1"></p>
          <button id="retryButton" type="button" class="mt-4 px-4 py-2.5 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface text-label-md inline-flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">refresh</span>Thử lại
          </button>
        </section>

        <!-- Hồ sơ -->
        <section id="contentState" class="hidden bg-surface-container-lowest rounded-2xl shadow-sm">
          <div class="p-6 flex items-center gap-4">
            <div id="avatar" class="w-16 h-16 rounded-full bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-center text-title-lg font-bold shrink-0">KZ</div>
            <div class="min-w-0">
              <h2 id="nameHeading" class="text-title-lg font-bold text-on-surface truncate"></h2>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <span id="roleBadge" class="px-2.5 py-0.5 rounded-full bg-primary-fixed text-primary text-caption font-semibold">Cán bộ học vụ</span>
                <span id="statusBadge" class="px-2.5 py-0.5 rounded-full text-caption font-semibold"></span>
              </div>
            </div>
          </div>

          <form id="profileForm" novalidate class="border-t border-surface-container">
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
              <div>
                <label for="fullNameInput" class="block text-label-md text-on-surface mb-1.5">Họ và tên <span class="text-error">*</span></label>
                <input id="fullNameInput" maxlength="100" class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-on-surface text-body-md outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/30">
                <p id="fullNameError" class="hidden text-caption text-error mt-1"></p>
              </div>
              <div>
                <label for="phoneInput" class="block text-label-md text-on-surface mb-1.5">Số điện thoại</label>
                <input id="phoneInput" maxlength="13" inputmode="tel" placeholder="Ví dụ: 0912345678" class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-on-surface text-body-md outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/30">
                <p id="phoneError" class="hidden text-caption text-error mt-1"></p>
              </div>
              <div>
                <label for="emailInput" class="block text-label-md text-on-surface mb-1.5">Email đăng nhập</label>
                <input id="emailInput" disabled class="w-full h-11 px-3 rounded-lg bg-surface-container text-on-surface-variant text-body-md cursor-not-allowed">
                <p class="text-caption text-outline mt-1">Email do quản trị viên cấp, không thể tự thay đổi.</p>
              </div>
              <div>
                <label for="joinedInput" class="block text-label-md text-on-surface mb-1.5">Ngày tham gia</label>
                <input id="joinedInput" disabled class="w-full h-11 px-3 rounded-lg bg-surface-container text-on-surface-variant text-body-md cursor-not-allowed">
              </div>
            </div>
            <div class="px-6 pb-6 flex items-center justify-end gap-3">
              <button id="resetButton" type="button" class="px-4 py-2.5 rounded-lg text-on-surface-variant text-label-md hover:bg-surface-container">Hoàn tác</button>
              <button id="saveButton" type="submit" class="px-5 py-2.5 rounded-lg bg-primary text-on-primary text-label-md inline-flex items-center gap-2 hover:bg-primary-container disabled:opacity-60 disabled:cursor-not-allowed">
                <span class="material-symbols-outlined text-[18px]">save</span><span id="saveText">Lưu thay đổi</span>
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="w-full py-6 px-4 md:px-8" style="background-color: #131D2E; color: #e3e8f3;">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <img src="/assets/logos/kizuna-logo.png" alt="KizunaTutor" class="w-8 h-8 rounded-lg object-contain bg-surface-container-lowest p-0.5">
          <span class="text-title-sm font-bold tracking-tight text-white">KizunaTutor</span>
          <span class="text-caption text-outline-variant">© 2026 Quản lý chất lượng đào tạo &amp; gia sư Nhật ngữ.</span>
        </div>
        <span class="text-caption text-outline-variant">Hệ thống điều hành học vụ</span>
      </div>
    </footer>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/pages/academic-profile/academic-profile.js"></script>
</body>
</html>
