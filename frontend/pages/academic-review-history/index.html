<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử xét duyệt - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/components/tutor-layout/tailwind-theme.js"></script>
  <link rel="stylesheet" href="/styles/tutor-theme.css">
</head>
<body class="bg-surface font-sans text-body-md text-on-surface antialiased">

  <div id="academicSidebar"></div>

  <div class="lg:pl-72 flex flex-col min-h-screen">
    <div id="academicTopbar"></div>

    <main class="flex-1 pt-16 lg:pt-0 w-full">
      <div class="px-4 md:px-8 py-8 flex flex-col w-full gap-6">

        <!-- 1. Tiêu đề -->
        <div class="flex flex-col gap-1">
          <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-primary-fixed text-primary">
              <span class="material-symbols-outlined text-[20px]">history_edu</span>
            </span>
            <h1 class="text-headline-lg text-on-surface font-bold tracking-tight">Lịch sử xét duyệt</h1>
          </div>
          <p class="text-body-md text-on-surface-variant">Các quyết định phê duyệt, từ chối và yêu cầu bổ sung đã đưa ra cho hồ sơ gia sư.</p>
        </div>

        <!-- 2. Bộ lọc + danh sách -->
        <section class="rounded-xl bg-surface-container-lowest shadow-sm overflow-hidden">
          <div class="p-6 pb-4 flex flex-col gap-4">
            <div class="flex flex-wrap gap-2" role="tablist" aria-label="Loại quyết định" id="actionTabs">
              <button type="button" data-action="ALL" class="action-tab px-3 py-1.5 rounded-full text-label-sm">Tất cả</button>
              <button type="button" data-action="APPROVE" class="action-tab px-3 py-1.5 rounded-full text-label-sm">Phê duyệt</button>
              <button type="button" data-action="REQUEST_INFO" class="action-tab px-3 py-1.5 rounded-full text-label-sm">Yêu cầu bổ sung</button>
              <button type="button" data-action="REJECT" class="action-tab px-3 py-1.5 rounded-full text-label-sm">Từ chối</button>
            </div>
            <form id="filterForm" autocomplete="off">
              <div class="relative flex items-center">
                <span class="material-symbols-outlined text-outline absolute left-3 text-[18px]">search</span>
                <input id="keywordInput" maxlength="100" type="search" placeholder="Tìm theo tên hoặc email gia sư..."
                       class="w-full h-10 pl-9 pr-3 rounded-lg bg-surface-container-low text-on-surface placeholder:text-outline text-body-sm outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all">
              </div>
            </form>
            <span id="totalText" class="text-label-sm text-on-surface-variant"></span>
          </div>

          <ul id="recordList" class="flex flex-col"></ul>

          <div id="listState" class="hidden p-10 text-center">
            <span id="listStateIcon" class="material-symbols-outlined text-5xl text-outline">inbox</span>
            <p id="listStateTitle" class="text-title-sm text-on-surface mt-2"></p>
            <button id="retryButton" type="button" class="hidden mt-3 px-3 py-1.5 rounded-lg bg-surface-container text-on-surface text-label-sm">Thử lại</button>
          </div>

          <div id="pager" class="p-4 px-6 bg-surface-container-low"></div>
        </section>
      </div>
    </main>

    <footer class="w-full py-6 px-4 md:px-8" style="background-color: #131D2E; color: #e3e8f3;">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <img src="/assets/logos/kizuna-logo.png" alt="KizunaTutor" class="w-8 h-8 rounded-lg object-contain bg-surface-container-lowest p-0.5">
          <span class="text-title-sm font-bold tracking-tight text-white">KizunaTutor</span>
          <span class="text-caption text-outline-variant">© 2026 Quản lý chất lượng đào tạo &amp; gia sư Nhật ngữ.</span>
        </div>
        <span class="text-caption text-outline-variant">Hệ thống điều hành học vụ</span>
      </div>
    </footer>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/pages/academic-review-history/academic-review-history.js"></script>
</body>
</html>
