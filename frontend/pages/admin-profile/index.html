<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ cá nhân - KizunaTutor</title>
<link rel="icon" href="/assets/logos/kizuna-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/styles/global.css"><link rel="stylesheet" href="/styles/admin.css"><link rel="stylesheet" href="/styles/operations.css"><link rel="stylesheet" href="/styles/admin-portal.css">
</head><body class="admin-dashboard operations-page"><a class="skip-link" href="#dashboardMain">Đến nội dung chính</a>
<main id="dashboardMain" class="dashboard-main">
<!-- !min-h-0: admin.css đặt .operations-content cao tối thiểu gần bằng màn hình; ở trang này vùng đó chỉ chứa tiêu đề
     (khung hồ sơ nằm ngay sau, ngoài vùng này) nên bỏ chiều cao tối thiểu để không tạo khoảng trống. -->
<div id="operationsContent" class="operations-content !min-h-0" aria-busy="true">
  <div class="operations-page-heading"><span class="role-badge">Tài khoản của bạn</span><h1>Hồ sơ cá nhân</h1><p>Quản lý thông tin tài khoản và bảo mật đăng nhập.</p></div>
  <p id="operationsNotice" role="alert" tabindex="-1" hidden></p><button id="retryLoad" type="button" hidden>Thử tải lại</button>
</div>

  <!-- Khung hồ sơ: mỗi hàng một nhóm thông tin (cùng bố cục với hồ sơ học viên).
       Đặt ngoài .operations-content để các quy tắc chung của khung quản trị cho input/label/button
       (lề trên 8px của input, màu nhãn, kiểu nút) không ghi đè làm lệch hàng. -->
  <section id="profileCard" class="bg-white rounded-2xl border border-[#E2E8F0] divide-y divide-[#EEF1F5] max-w-[1100px]">

    <!-- 1. Thông tin cá nhân -->
    <form id="personalForm" novalidate class="grid grid-cols-1 md:grid-cols-[240px,1fr] gap-4 md:gap-8 p-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[20px] text-[#006194]">person</span>
          <h2 class="text-[15px] font-bold text-[#0F2545]">Thông tin cá nhân</h2>
        </div>
        <div class="text-xs text-[#68737D] mt-1 leading-relaxed">Email và vai trò do Quản trị viên quản lý nên không đổi tại đây.</div>
      </div>
      <div class="space-y-4 min-w-0">
        <div class="flex flex-wrap items-center gap-4">
          <div id="profileAvatar" class="w-16 h-16 shrink-0 rounded-full overflow-hidden bg-[#006194]/10 text-[#006194] flex items-center justify-center text-xl font-bold" aria-hidden="true">—</div>
          <div class="min-w-0">
            <div id="profileName" class="text-[15px] font-bold text-[#0F2545] break-words">Đang tải…</div>
            <div id="profileDetails" class="text-xs text-[#68737D] break-all"></div>
            <div class="flex flex-wrap items-center gap-2 mt-1">
              <span id="profileRole" class="px-2.5 py-0.5 rounded-full bg-[#006194]/10 text-[#006194] text-xs font-semibold"></span>
              <span id="profileStatus" class="px-2.5 py-0.5 rounded-full bg-[#059669]/10 text-[#047857] text-xs font-semibold"></span>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="profileFullName" class="block text-sm text-[#0F2545] mb-1.5">Họ tên</label>
            <input id="profileFullName" maxlength="100" autocomplete="name"
                   class="w-full rounded-lg border border-[#D9DEE5] px-3 py-2.5 text-sm focus:outline-none focus:border-[#006194] focus:ring-2 focus:ring-[#006194]/15">
            <div data-error-for="profileFullName" class="hidden mt-1 text-xs text-[#BA1A1A]"></div>
          </div>
          <div>
            <label for="profileEmail" class="block text-sm text-[#0F2545] mb-1.5">Email</label>
            <div class="flex">
              <input id="profileEmail" type="email" readonly class="flex-1 min-w-0 rounded-l-lg border border-[#D9DEE5] px-3 py-2.5 text-sm text-[#3F4850] bg-white cursor-default focus:outline-none">
              <span class="inline-flex items-center px-3 rounded-r-lg border border-l-0 border-[#D9DEE5] bg-[#F1F5F9] text-[#0F2545]" title="Không thể thay đổi email">
                <span class="material-symbols-outlined text-[18px]">lock</span>
              </span>
            </div>
          </div>
        </div>
        <div data-form-message class="hidden rounded-lg px-4 py-3 text-sm"></div>
        <div class="flex justify-end">
          <button type="submit" data-save class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[#006194] text-white text-sm font-semibold hover:bg-[#004b73] disabled:opacity-50 disabled:cursor-not-allowed">
            <span class="material-symbols-outlined text-[18px]">save</span><span data-save-label>Lưu thay đổi</span>
          </button>
        </div>
      </div>
    </form>

    <!-- 2. Số điện thoại -->
    <form id="phoneForm" novalidate class="grid grid-cols-1 md:grid-cols-[240px,1fr] gap-4 md:gap-8 p-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[20px] text-[#006194]">call</span>
          <h2 class="text-[15px] font-bold text-[#0F2545]">Số điện thoại</h2>
        </div>
        <div class="text-xs text-[#68737D] mt-1 leading-relaxed">Để đồng nghiệp và bộ phận hỗ trợ liên lạc với bạn khi cần.</div>
      </div>
      <div class="min-w-0">
        <div id="phoneView" class="flex flex-wrap items-center justify-between gap-3">
          <span id="phoneText" class="text-[15px] text-[#0F2545]"></span>
          <button id="btnEditPhone" type="button" class="px-3 py-1.5 rounded-lg border border-[#006194] text-[#006194] text-sm font-medium hover:bg-[#006194]/5">Đổi số</button>
        </div>
        <div id="phoneEdit" class="hidden space-y-3">
          <div class="max-w-sm">
            <label for="profilePhone" class="block text-sm text-[#0F2545] mb-1.5">Số điện thoại mới</label>
            <input id="profilePhone" type="tel" maxlength="20" autocomplete="tel" placeholder="0912345678"
                   class="w-full rounded-lg border border-[#D9DEE5] px-3 py-2.5 text-sm focus:outline-none focus:border-[#006194] focus:ring-2 focus:ring-[#006194]/15">
            <div data-error-for="profilePhone" class="hidden mt-1 text-xs text-[#BA1A1A]"></div>
          </div>
          <div class="flex justify-end gap-2">
            <button id="btnCancelPhone" type="button" class="px-4 py-2 rounded-lg border border-[#D9DEE5] text-sm font-medium text-[#3F4850] hover:bg-[#F8FAFC]">Hủy</button>
            <button type="submit" data-save class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[#006194] text-white text-sm font-semibold hover:bg-[#004b73] disabled:opacity-50 disabled:cursor-not-allowed">
              <span class="material-symbols-outlined text-[18px]">save</span><span data-save-label>Lưu số mới</span>
            </button>
          </div>
        </div>
        <div data-form-message class="hidden mt-3 rounded-lg px-4 py-3 text-sm"></div>
      </div>
    </form>

    <!-- 3. Mật khẩu (khối dùng chung components/change-password) -->
    <div id="changePasswordSection"></div>
  </section>
</main>
<script type="module" src="./admin-profile.js"></script></body></html>
