<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận đặt lịch - KizunaTutor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006194",
            "primary-container": "#007bb9",
            navy: "#0F2545",
            washi: "#FCFBF7"
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/utilities.css">
</head>
<!-- Màn hình rộng: khóa cả trang vừa một màn hình, chỉ form bên phải cuộn trong khung của nó -->
<body class="bg-[#FCFBF7] font-sans text-[#0F2545] min-h-screen md:h-screen md:overflow-hidden flex flex-col antialiased">

  <div id="header-placeholder"></div>

  <main class="w-full pt-28 pb-16 md:pb-5 flex-1 md:min-h-0 flex flex-col">
    <div class="w-full max-w-[1040px] mx-auto px-4 md:px-8 md:flex-1 md:min-h-0 flex flex-col">

      <button type="button" id="bc-back" class="self-start shrink-0 mb-2 inline-flex items-center gap-1.5 px-3 py-1.5 -ml-3 rounded-xl text-sm font-semibold text-slate-600 hover:text-[#006194] hover:bg-white transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>Quay lại
      </button>

      <!-- Đang tải / lỗi tải -->
      <div id="bc-loading" class="py-24 text-center">
        <span class="material-symbols-outlined text-primary text-[40px] animate-spin">progress_activity</span>
        <p class="text-sm font-medium mt-3 text-slate-500">Đang tải thông tin đặt lịch...</p>
      </div>

      <div id="bc-content" class="hidden grid grid-cols-1 md:grid-cols-[320px_minmax(0,1fr)] md:grid-rows-[minmax(0,1fr)] md:flex-1 md:min-h-0 gap-5 md:gap-6">

        <!-- Cột trái: gia sư + giờ đã chọn -->
        <aside class="space-y-4">
          <div class="bg-white rounded-2xl border border-[#E5DECB] p-5">
            <div class="text-sm font-bold mb-3">Gia sư của bạn</div>
            <div class="flex items-center justify-between gap-3">
              <div class="min-w-0">
                <div id="bc-tutor-name" class="text-xl font-bold leading-tight break-words"></div>
                <div class="text-xs text-slate-500 mt-1">Gia sư tiếng Nhật</div>
              </div>
              <div id="bc-avatar" class="shrink-0"></div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-[#E5DECB] overflow-hidden">
            <div class="p-5 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <span id="bc-details-title" class="text-sm font-bold">Chi tiết buổi học thử</span>
                <button type="button" id="bc-change-time" class="inline-flex items-center gap-1 text-xs font-semibold text-[#006194] hover:underline cursor-pointer">
                  <span class="material-symbols-outlined text-[16px]">edit_calendar</span>Đổi giờ
                </button>
              </div>
              <div id="bc-summary" class="text-xs space-y-2"></div>
            </div>
            <div id="bc-details-note" class="px-5 py-3 bg-emerald-50 border-t border-emerald-100 text-[11px] font-semibold text-emerald-800"></div>
          </div>
        </aside>

        <!-- Cột phải: form thông tin -->
        <div class="bg-white rounded-3xl border border-[#E5DECB] shadow-sm overflow-hidden flex flex-col md:min-h-0">
        <div class="shrink-0 px-5 md:px-6 py-4 border-b border-[#ECE8DE]">
          <h1 id="bc-title" class="text-lg md:text-xl font-bold leading-tight">Xác nhận đặt lịch</h1>
          <p class="text-xs text-slate-500 font-medium mt-0.5">Điền thông tin để gia sư liên hệ với bạn</p>
        </div>

        <!-- Thanh cuộn ẩn: form gọn vừa khung; màn hình thấp vẫn cuộn được bằng chuột -->
        <div id="bc-body" class="divide-y divide-[#ECE8DE] md:flex-1 md:min-h-0 md:overflow-y-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
          <!-- Thông tin học viên -->
          <div class="px-5 md:px-6 py-4 space-y-3">

            <!-- Hình thức học: chỉ cho kết nối; gia sư dạy một hình thức thì chỉ còn lựa chọn đó -->
            <div id="bc-mode-box" class="hidden space-y-1.5">
              <span class="block text-xs font-bold">Hình thức học</span>
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-700 cursor-pointer has-[:checked]:border-[#006194] has-[:checked]:bg-[#E0EFF7] has-[:checked]:text-[#006194]">
                  <input type="radio" name="bc-mode" value="ONLINE" class="accent-[#006194]" checked>
                  <span class="material-symbols-outlined text-[18px]">videocam</span> Học online
                </label>
                <label class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-700 cursor-pointer has-[:checked]:border-[#006194] has-[:checked]:bg-[#E0EFF7] has-[:checked]:text-[#006194]">
                  <input type="radio" name="bc-mode" value="OFFLINE" class="accent-[#006194]">
                  <span class="material-symbols-outlined text-[18px]">home_pin</span> Học trực tiếp
                </label>
              </div>
              <div id="bc-location-box" class="hidden space-y-1">
                <label for="bc-location" class="block text-[11px] font-semibold text-slate-600">Khu vực / địa điểm học (*)</label>
                <input type="text" id="bc-location" maxlength="500" placeholder="Ví dụ: Phường Dịch Vọng, Cầu Giấy, Hà Nội"
                  class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-primary">
                <p class="text-[11px] text-slate-500">Gia sư sẽ liên hệ để thống nhất địa chỉ chính xác.</p>
              </div>
            </div>

            <!-- Trình độ lấy từ hồ sơ học viên, không nhập lại ở đây -->
            <div data-learner-level class="text-xs text-slate-600"></div>

            <!-- Môn muốn học (cả học thử lẫn kết nối) -->
            <div id="bc-goals-box" class="space-y-1">
              <span class="block text-xs font-bold">Bạn muốn học môn nào?</span>
              <div id="bc-goals" data-goal-picker class="flex flex-wrap gap-2"></div>
            </div>

            <div class="space-y-2 rounded-xl border border-slate-200 bg-slate-50/60 p-3">
              <div class="text-xs font-bold">Liên hệ của bạn</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div class="space-y-1">
                  <label for="bc-contact-phone" class="block text-[11px] font-semibold text-slate-600">Số điện thoại (*)</label>
                  <input type="tel" id="bc-contact-phone" data-contact-phone inputmode="tel" maxlength="16" placeholder="Ví dụ: 0912345678" autocomplete="tel"
                    class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-primary">
                </div>
                <div class="space-y-1">
                  <label for="bc-contact-email" class="block text-[11px] font-semibold text-slate-600">Email</label>
                  <input type="email" id="bc-contact-email" data-contact-email maxlength="255" placeholder="Email của bạn" autocomplete="email"
                    class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-primary">
                </div>
              </div>
              <label class="flex items-start gap-2 text-[11px] text-slate-600 leading-relaxed cursor-pointer">
                <input type="checkbox" id="bc-contact-consent" class="mt-0.5 accent-[#006194]">
                <span>Tôi đồng ý gửi hồ sơ, email và số điện thoại cho gia sư này để gia sư liên hệ. Khi gia sư đồng ý, tôi sẽ thấy số điện thoại và email của gia sư.</span>
              </label>
            </div>

            <div class="space-y-1">
              <label for="bc-notes" class="block text-xs font-bold">Lời nhắn gửi gia sư (tùy chọn)</label>
              <textarea id="bc-notes" rows="2" maxlength="1000" placeholder="Giới thiệu ngắn về bạn và mong muốn khi học..." class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-primary resize-none"></textarea>
            </div>

            <div id="bc-error-alert" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2" role="alert">
              <span class="material-symbols-outlined text-base flex-shrink-0">error</span>
              <span id="bc-error-message"></span>
            </div>
          </div>
        </div>

        <!-- Nút gửi luôn nằm dưới cùng khung form -->
        <div id="bc-footer" class="shrink-0 px-5 md:px-6 py-3 border-t border-[#ECE8DE]">
          <button type="button" id="bc-submit" class="w-full py-3 px-4 rounded-2xl text-sm font-bold transition-all flex items-center justify-center gap-2 bg-[#006194] text-white shadow-md hover:bg-[#004b73] active:scale-[0.99] cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            <span id="bc-submit-text">Xác nhận gửi yêu cầu</span>
            <span class="material-symbols-outlined text-[18px]">send</span>
          </button>
        </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/pages/booking-confirm/booking-confirm.js"></script>
</body>
</html>
