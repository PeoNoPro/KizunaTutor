<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập Flashcard 3D - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Single Source of Truth CSS -->
  <link rel="stylesheet" href="/assets/css/learning-support-common.css">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/utilities.css">

  <style>
    /* Hiệu ứng lật 3D chuyên nghiệp */
    .flashcard-perspective {
      perspective: 1200px;
    }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flashcard-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
    }
    .flashcard-face-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="learning-support-body antialiased min-h-screen selection:bg-[#E0399A] selection:text-white">
  <div class="flex h-screen overflow-hidden">

    <!-- 1. SIDEBAR DÙNG CHUNG CHO HỌC VIÊN -->
    <div id="learnerSidebarContainer"></div>

    <!-- 2. MAIN CONTENT AREA: CUỘN ĐỘC LẬP -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      <!-- HEADER DÙNG CHUNG CHO HỌC VIÊN -->
      <div id="learnerHeaderContainer"></div>

      <!-- Main Shell cuộn mượt mà -->
      <main class="flex-1 overflow-y-auto p-3 sm:p-4 flex flex-col min-w-0">
        <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col space-y-4">

          <!-- EMPTY STATE KHI BỘ THẺ RỖNG -->
          <div id="studyEmptyState" class="hidden flex-1 flex flex-col items-center justify-center p-12 ls-card border-dashed text-center space-y-4">
            <span class="text-5xl">📭</span>
            <h3 class="font-bold text-lg text-[#0F172A]">Bộ thẻ này hiện chưa có nội dung để học</h3>
            <p class="text-xs text-[#707881] max-w-sm">
              Bạn hãy quay lại trang chi tiết bộ thẻ để thêm từ vựng hoặc nạp nhanh hàng chục thẻ từ file Excel nhé!
            </p>
            <button type="button" id="btnBackToDeck" class="ls-btn ls-btn-primary">
              ← Quay lại bộ thẻ
            </button>
          </div>

          <!-- CONTAINER CHÍNH KHI CÓ DỮ LIỆU -->
          <div id="studyMainContainer" class="flex-1 flex flex-col space-y-4">

            <!-- KHU VỰC THẺ 3D XOAY LẬT -->
            <div class="flashcard-perspective w-full h-[320px] sm:h-[380px] md:h-[400px] select-none cursor-pointer">
              <div id="studyCardInner" class="flashcard-inner">
                <!-- Mặt trước -->
                <div class="flashcard-face ls-card p-6 text-center shadow-[4px_4px_0px_0px_#0F172A] bg-[#FEF3C7]!">
                  <span class="absolute top-4 left-4 ls-badge ls-badge-jlpt" id="studyCardLevel">
                    JLPT
                  </span>
                  <span class="absolute top-4 right-4 text-xs font-bold font-mono text-[#707881]" id="studyCardStep">
                    1 / 10
                  </span>

                  <div class="my-auto space-y-3 w-full px-4">
                    <div id="studyCardChar" class="font-bold text-[#0F172A] font-serif leading-tight break-words text-5xl md:text-6xl select-none">
                      —
                    </div>
                    <p class="text-xs text-[#707881] flex items-center justify-center gap-1">
                      <span class="material-symbols-outlined text-[15px]">touch_app</span>
                      <span>Chạm thẻ hoặc bấm SPACE để lật mặt sau</span>
                    </p>
                  </div>
                </div>

                <!-- Mặt sau -->
                <div class="flashcard-face flashcard-face-back ls-card p-5 sm:p-6 text-left shadow-[4px_4px_0px_0px_#0F172A] flex flex-col justify-between bg-white!">
                  <div class="w-full flex items-center justify-between pb-2 border-b border-[#0F172A]/15">
                    <div class="flex items-center gap-2 truncate">
                      <span class="text-2xl sm:text-3xl font-bold text-[#0F172A] font-serif truncate" id="studyCardCharBack">—</span>
                      <span class="text-base font-bold text-[#831843]" id="studyCardHanViet"></span>
                    </div>
                    <button type="button" id="btnStudyAudio" class="ls-btn ls-btn-default w-8 h-8 p-0" title="Phát âm từ vựng (VOICEVOX AI TTS)">
                      🔊
                    </button>
                  </div>

                  <!-- Khối nội dung giải nghĩa tự thích ứng -->
                  <div class="w-full my-auto py-2 overflow-y-auto max-h-[200px] space-y-2 text-xs sm:text-sm" id="studyCardMeaningContainer">
                  </div>

                  <div class="w-full pt-2 border-t border-[#0F172A]/15 flex items-center justify-between">
                    <a id="btnStudyPracticeShodo" href="#" 
                       class="text-xs font-bold text-[#831843] hover:underline flex items-center gap-1 no-underline">
                      <span>🖌️</span>
                      <span>Luyện viết chữ này</span>
                    </a>
                    <span class="text-[11px] text-[#707881]">Chạm thẻ để lật lại</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- THANH ĐIỀU KHIỂN CHUẨN ANKI / QUIZLET -->
            <div class="ls-toolbar select-none">
              <!-- Bên trái: Xáo trộn ngẫu nhiên -->
              <button type="button" id="btnShuffle" 
                      class="ls-btn ls-btn-default py-1.5 px-3 text-xs"
                      title="Xáo trộn thứ tự các thẻ">
                <span>🔀</span>
                <span>Xáo trộn</span>
              </button>

              <!-- Chính giữa: Bộ điều hướng -->
              <div class="flex items-center gap-2">
                <button type="button" id="btnPrevCard"
                        class="ls-btn ls-btn-default py-1.5 px-3 text-xs"
                        title="Thẻ trước (Mũi tên trái)">
                  <span>←</span>
                  <span class="hidden sm:inline">Thẻ trước</span>
                </button>

                <span id="studyProgressBadge" 
                      class="ls-badge bg-[#E0F2FE] text-[#006194] py-1.5 px-3 text-xs font-bold min-w-[80px] text-center shrink-0">
                  Thẻ 0 / 0
                </span>

                <button type="button" id="btnNextCard"
                        class="ls-btn ls-btn-primary py-1.5 px-3 text-xs"
                        title="Thẻ tiếp theo (Mũi tên phải)">
                  <span class="hidden sm:inline">Tiếp theo</span>
                  <span>→</span>
                </button>
              </div>

              <!-- Bên phải: Lật thẻ -->
              <button type="button" id="btnFlipCard"
                      class="ls-btn ls-btn-active py-1.5 px-3.5 text-xs"
                      title="Lật thẻ (Bấm thẻ hoặc phím Space)">
                <span>🔄</span>
                <span>Lật thẻ</span>
              </button>
            </div>

          </div>

          <!-- FOOTER -->
          <div id="learnerFooterContainer"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/components/learner-layout/learner-layout.js"></script>
  <script type="module" src="/pages/flashcards-study/flashcards-study.js"></script>
</body>
</html>
