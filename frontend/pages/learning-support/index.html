<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Từ Vựng & Hỗ Trợ Học Tập Đời Sống - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind & Project CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/learning-support-common.css">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/utilities.css">
</head>
<body class="bg-[#F8FAFC] text-[#334155] font-body antialiased selection:bg-[#E0399A] selection:text-white">
  <div class="flex h-screen overflow-hidden bg-[#F8FAFC]">

    <!-- 1. SIDEBAR DÙNG CHUNG CHO HỌC VIÊN -->
    <div id="learnerSidebarContainer"></div>

    <!-- 2. MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

      <!-- HEADER DÙNG CHUNG CHO HỌC VIÊN -->
      <div id="learnerHeaderContainer"></div>

      <!-- Scrollable Main Container -->
      <main class="flex-1 overflow-y-auto p-3 sm:p-4 w-full max-w-6xl mx-auto">
        <div class="space-y-3">

          <!-- Thanh chọn chủ đề & Tìm kiếm nhanh -->
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-3 sm:p-4 space-y-3">
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
              <!-- Danh sách Pills chủ đề thực tế -->
              <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 flex-1" id="topicTabsContainer">
                <!-- Sẽ render tự động bởi learning-support.js -->
              </div>

              <!-- Ô Tìm kiếm nhanh -->
              <div class="relative w-full sm:w-72 shrink-0">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">search</span>
                <input type="text" id="inputSearchVocab" 
                       placeholder="Tìm từ vựng, kanji, nghĩa..." 
                       class="w-full pl-9 pr-3 py-1.5 text-xs rounded-lg border border-[#CBD5E1] bg-white text-[#0F172A] focus:outline-none focus:border-[#831843] focus:ring-1 focus:ring-[#831843] transition">
              </div>
            </div>

            <!-- Tóm tắt chủ đề hiện tại -->
            <div class="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-[#E2E8F0]">
              <div class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="activeTopicLabel" class="font-semibold text-[#0F172A]">Đang nạp dữ liệu...</span>
              </div>
              <span id="vocabCountBadge" class="text-xs text-slate-400">0 mục</span>
            </div>
          </div>

          <!-- Lưới Thẻ Từ Vựng -->
          <div id="vocabGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            <!-- Sẽ render động qua learning-support.js -->
          </div>

          <!-- Trạng Thái Rỗng -->
          <div id="vocabEmptyState" class="hidden p-8 text-center rounded-xl border border-dashed border-[#CBD5E1] bg-white space-y-2">
            <span class="material-symbols-outlined text-3xl text-slate-400">search_off</span>
            <h3 class="text-sm font-bold text-[#0F172A]">Không tìm thấy từ vựng phù hợp</h3>
            <p class="text-xs text-slate-500">
              Hãy thử tìm kiếm với từ khóa khác hoặc chuyển sang chủ đề khác nhé.
            </p>
          </div>

        </div>
        <div id="learnerFooterContainer"></div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/components/learner-layout/learner-layout.js"></script>
  <script type="module" src="/pages/learning-support/learning-support.js"></script>
</body>
</html>
