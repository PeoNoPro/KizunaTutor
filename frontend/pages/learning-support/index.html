<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Từ Vựng - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind & Project CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/shodo-tailwind-theme.js"></script>
  <link rel="stylesheet" href="/assets/css/learning-support-common.css">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/utilities.css">
</head>
<body class="bg-[#F8FAFC] text-[#334155] font-body antialiased selection:bg-[#E0399A] selection:text-white">
  <div class="flex h-screen overflow-hidden bg-[#F8FAFC]">

    <!-- 1. SIDEBAR DÙNG CHUNG CHO HỌC VIÊN -->
    <div id="learnerSidebarContainer"></div>

    <!-- 2. MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      
      <!-- HEADER DÙNG CHUNG CHO HỌC VIÊN -->
      <div id="learnerHeaderContainer"></div>

      <!-- Scrollable Main Container -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 w-full max-w-6xl mx-auto">
        <div class="space-y-3">

          <!-- Bảng Chọn Cấp Độ, Ô Tìm Kiếm & Dải Topic Pills -->
          <div class="bg-white border-2 border-[#0F172A] rounded-xl p-4 sm:p-5 shadow-[3px_3px_0px_0px_#0F172A] space-y-3">
            <div class="flex items-center justify-between gap-2.5 flex-wrap pb-2 border-b border-[#E2E8F0]">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-[#0F172A] uppercase tracking-wider">Chủ đề từ vựng:</span>
                <span id="activeTopicBadge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[#FFE5EC] text-[#831843] border border-[#FBCFE8]">
                  Tất cả JLPT
                </span>
              </div>

              <!-- Ô Tìm Kiếm Nhanh Từ Vựng -->
              <div class="w-full sm:w-80 shrink-0">
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <span class="material-symbols-outlined text-[18px]">search</span>
                  </span>
                  <input type="text" id="searchVocabInput"
                         placeholder="Tìm từ vựng, Hiragana, Hán Việt, nghĩa..."
                         class="w-full pl-9 pr-3 py-2 text-xs rounded-lg border border-[#CBD5E1] bg-white text-[#0F172A] focus:outline-none focus:border-[#831843] focus:ring-1 focus:ring-[#831843] transition">
                </div>
              </div>
            </div>

            <div class="flex items-center justify-between flex-wrap gap-2 text-xs text-slate-500 pt-0.5">
              <span id="topicCountSummary" class="font-medium">
                Đang nạp danh mục...
              </span>

              <!-- Nút Luyện tập Kana & Cụm chuyển đổi chế độ hiển thị từ vựng JLPT -->
              <div class="flex items-center gap-2 flex-wrap">
                <a href="/kana"
                   class="px-2.5 py-1 text-xs font-semibold rounded-md border border-[#CBD5E1] bg-white text-[#0F172A] hover:bg-slate-50 transition flex items-center gap-1.5 no-underline shadow-2xs"
                   title="Luyện phản xạ gõ bảng chữ cái Hiragana & Katakana">
                  <span>⌨️</span>
                  <span>Đấu trường Kana</span>
                </a>
              <div class="inline-flex items-center p-0.5 bg-[#F1F5F9] rounded-lg border border-[#E2E8F0]">
                <button type="button" id="btnModeJlpt" data-view-mode="jlpt"
                        class="px-2.5 py-1 text-xs font-bold rounded-md transition cursor-pointer bg-white text-[#831843] shadow-xs"
                        title="Tự động hiển thị Kana đối với từ vựng không yêu cầu chữ Hán ở cấp độ này">
                  <span>🎯 Chuẩn JLPT</span>
                </button>
                <button type="button" id="btnModeKanji" data-view-mode="kanji"
                        class="px-2.5 py-1 text-xs font-medium rounded-md transition cursor-pointer text-[#64748B] hover:text-[#0F172A]"
                        title="Luôn hiển thị chữ Hán to nhất để học âm Hán Việt">
                  <span>🈸 Chữ Hán</span>
                </button>
                <button type="button" id="btnModeKana" data-view-mode="kana"
                        class="px-2.5 py-1 text-xs font-medium rounded-md transition cursor-pointer text-[#64748B] hover:text-[#0F172A]"
                        title="Luôn hiển thị Hiragana / Katakana to nhất để luyện phát âm">
                  <span>🔤 Chữ Kana</span>
                </button>
              </div>
              </div>
            </div>

            <!-- Dải nút chọn chủ đề (Topic Pills) -->
            <div id="topicPillsContainer" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none items-center min-w-0">
              <!-- Render tự động bởi learning-support.js -->
            </div>
          </div>

          <!-- Lưới Thẻ Từ Vựng -->
          <div id="vocabGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 items-stretch pb-2 min-w-0">
            <!-- Nạp động qua JS -->
          </div>

          <!-- Empty State -->
          <div id="vocabEmptyState" class="hidden p-8 sm:p-12 text-center rounded-xl border border-dashed border-[#CBD5E1] bg-white space-y-2">
            <div class="text-3xl">🔍</div>
            <h3 class="text-sm sm:text-base font-bold text-[#0F172A]">Không tìm thấy từ vựng phù hợp</h3>
            <p class="text-xs text-slate-500">Hãy thử tìm bằng từ khóa khác hoặc chuyển sang cấp độ khác nhé.</p>
          </div>

          <!-- FOOTER DÙNG CHUNG -->
          <footer class="mt-6 pt-3 pb-3 border-t border-[#0F172A]/10 text-center text-xs text-slate-500">
            KizunaTutor &copy; 2026 &bull; Đồng hành cùng bạn trên từng từ vựng tiếng Nhật 🌸
          </footer>
        </div>
      </main>
    </div>
  </div>

  <!-- ==================== MODAL CHỌN BỘ THẺ LƯU TỪ VỰNG ==================== -->
  <div id="vocabSaveToDeckModal"
       class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-[2px] items-center justify-center p-4">
    <div class="bg-white max-w-md w-full border-2 border-[#0F172A] shadow-[4px_4px_0px_0px_#0F172A] rounded-xl overflow-hidden font-sans"
         onclick="event.stopPropagation()">
      <div class="px-5 py-3.5 border-b border-[#E2E8F0] bg-[#FAF8F2] flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[20px] text-[#831843]">bookmark_add</span>
          <h3 class="text-sm sm:text-base font-bold text-[#0F172A]">Lưu từ vựng vào bộ thẻ</h3>
        </div>
        <button type="button" id="btnCloseVocabDeckModal"
                class="w-7 h-7 rounded-lg border border-[#CBD5E1] bg-white hover:bg-slate-100 flex items-center justify-center font-bold text-slate-600 text-xs transition cursor-pointer">
          ✕
        </button>
      </div>

      <div class="p-5 space-y-4">
        <!-- Xem trước từ vựng đang lưu -->
        <div class="p-3.5 rounded-xl bg-[#FFE5EC]/50 border border-[#FBCFE8] flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-baseline gap-2 flex-wrap">
              <span id="modalVocabWord" class="text-xl font-bold text-[#0F172A] font-japanese">—</span>
              <span id="modalVocabReading" class="text-xs font-medium text-[#831843]"></span>
            </div>
            <p id="modalVocabMeaning" class="text-xs text-[#334155] mt-1 line-clamp-2"></p>
          </div>
          <span id="modalVocabLevel" class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-white text-[#831843] border border-[#FBCFE8] shrink-0">N5</span>
        </div>

        <form id="formSaveVocabToDeck" class="space-y-3.5" novalidate>
          <div>
            <label for="modalVocabDeckSelect" class="block text-xs font-bold text-[#0F172A] uppercase tracking-wider mb-1.5">
              Chọn bộ thẻ muốn lưu:
            </label>
            <select id="modalVocabDeckSelect"
                    class="w-full px-3 py-2.5 rounded-lg border border-[#CBD5E1] text-sm text-[#0F172A] bg-white font-semibold outline-none focus:border-[#831843] focus:ring-2 focus:ring-[#831843]/15 transition">
              <option value="">Đang tải danh sách bộ thẻ...</option>
            </select>
          </div>

          <div id="newVocabDeckInputWrapper" class="hidden">
            <label for="modalNewVocabDeckNameInput" class="block text-xs font-bold text-[#0F172A] uppercase tracking-wider mb-1.5">
              Tên bộ thẻ mới *
            </label>
            <input type="text" id="modalNewVocabDeckNameInput"
                   placeholder="Ví dụ: Từ vựng N5 tuần 1..."
                   class="w-full px-3 py-2 rounded-lg border border-[#CBD5E1] text-sm text-[#0F172A] bg-white font-semibold outline-none focus:border-[#831843] focus:ring-2 focus:ring-[#831843]/15 transition">
          </div>

          <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-[#E2E8F0]">
            <button type="button" id="btnCancelVocabDeckModal"
                    class="px-4 py-2 rounded-lg bg-white border border-[#CBD5E1] text-[#1E293B] hover:bg-slate-50 text-xs font-semibold transition cursor-pointer">
              Hủy bỏ
            </button>
            <button type="submit" id="btnConfirmSaveVocabDeck"
                    class="px-5 py-2 rounded-lg bg-[#831843] hover:bg-[#9F1239] text-white text-xs font-bold transition cursor-pointer flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[16px]">save</span>
              <span>Lưu vào bộ thẻ</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Shared Layout & Component Scripts -->
  <script type="module" src="/components/learner-layout/learner-layout.js"></script>
  <script type="module" src="/pages/learning-support/learning-support.js?v=20261110_v4"></script>
</body>
</html>
