<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Từ Vựng & Hỗ Trợ Học Tập Đời Sống - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind & Project CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/utilities.css">
</head>
<body class="bg-white text-[#1E293B] font-sans antialiased">
  <div class="flex h-screen overflow-hidden bg-white">

    <!-- 1. SIDEBAR DÙNG CHUNG CHO HỌC VIÊN -->
    <div id="learnerSidebarContainer"></div>

    <!-- 2. MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      
      <!-- HEADER DÙNG CHUNG CHO HỌC VIÊN -->
      <div id="learnerHeaderContainer"></div>

      <!-- Scrollable Main Container -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 bg-white flex flex-col min-w-0">
        <div class="max-w-[1240px] w-full mx-auto flex-1 space-y-6">

          <!-- Bảng Chọn Cấp Độ, Ô Tìm Kiếm & Dải Topic Pills Cuộn Ngang Mượt Mà -->
          <div class="bg-white border border-[#ECE8DE] rounded-2xl p-4 shadow-sm space-y-3">
            <div class="flex items-center justify-between gap-3 flex-wrap pb-2 border-b border-[#ECE8DE]">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-[#0F2545] uppercase tracking-wider">Chủ đề từ vựng:</span>
                <span id="activeTopicBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-[#FFE5EC] text-[#831843] border border-[#FBCFE8]">
                  Tất cả JLPT
                </span>
              </div>

              <!-- Ô Tìm Kiếm Nhanh Từ Vựng -->
              <div class="w-full sm:w-80 shrink-0">
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <span class="material-symbols-outlined text-[18px]">search</span>
                  </span>
                  <input type="text" id="searchVocabInput"
                         placeholder="Tìm từ vựng, Hiragana, Hán Việt, nghĩa..."
                         class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-[#ECE8DE] bg-[#FAF8F2] text-[#0F2545] focus:bg-white focus:border-[#006194] focus:outline-none transition">
                </div>
              </div>
              <span id="topicCountSummary" class="text-xs text-[#68737D] font-medium">
                Đang nạp danh mục...
              </span>
            </div>

            <!-- Dải nút chọn chủ đề (Topic Pills) sử dụng thanh cuộn ngang mượt mà nếu tràn -->
            <div id="topicPillsContainer" class="flex gap-3 overflow-x-auto pb-2 scrollbar-none items-center min-w-0">
              <!-- Render tự động bởi learning-support.js -->
            </div>
          </div>

          <!-- Lưới Thẻ Từ Vựng: Auto-fill chống vỡ card (grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4) -->
          <div id="vocabGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-stretch pb-4 min-w-0">
            <!-- Nạp động qua JS -->
          </div>

          <!-- Empty State -->
          <div id="vocabEmptyState" class="hidden p-10 text-center rounded-2xl border-2 border-dashed border-[#ECE8DE] bg-white space-y-2">
            <div class="text-3xl">🔍</div>
            <h3 class="text-base font-bold text-[#0F2545]">Không tìm thấy từ vựng phù hợp</h3>
            <p class="text-xs text-[#68737D]">Hãy thử tìm bằng từ khóa khác hoặc chuyển sang cấp độ khác nhé.</p>
          </div>

        </div>
        <!-- FOOTER DÙNG CHUNG CHO HỌC VIÊN -->
        <div id="learnerFooterContainer"></div>
      </main>
    </div>
  </div>

  <!-- Shared Layout & Component Scripts -->
  <script type="module" src="/components/learner-layout/learner-layout.js"></script>
  <script type="module" src="/pages/learning-support/learning-support.js"></script>
</body>
</html>
