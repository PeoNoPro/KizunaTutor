<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lớp học của tôi - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/utilities.css">
  <style id="my-courses-retro-style">
    .mc-heading { font-family: 'Itim', cursive; }
    .mc-body { font-family: 'Segoe UI', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; color: #000; }
    .mc-meta { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
    .mc-card {
      background: #FFFFFF; border: 1px solid #000000; border-radius: 5px;
      box-shadow: 4px 4px 0 0 #000000;
    }
    .mc-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid #000; border-radius: 5px; padding: 8px 14px; font-weight: 600; font-size: 14px;
      background: #fff; color: #000; box-shadow: 3px 3px 0 0 #000; cursor: pointer;
      transition: transform .15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow .15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mc-btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 0 #000; }
    .mc-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 #000; }
    .mc-btn:disabled { opacity: .5; cursor: not-allowed; }
    .mc-btn-primary { background: #2A5A1A; color: #fff; }
    .mc-badge {
      display: inline-flex; align-items: center; border: 1px solid #000; border-radius: 5px;
      padding: 2px 8px; font-size: 11px; font-weight: 600; background: #fff;
    }
    .mc-badge[data-tone="active"] { background: #E5F4EA; color: #1E8B3F; }
    .mc-badge[data-tone="paused"] { background: #FDEDE8; color: #BF360C; }
    .mc-badge[data-tone="done"] { background: #F1F1F1; color: #333; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] font-sans antialiased">
  <div class="flex h-screen overflow-hidden bg-[#F8FAFC]">

    <!-- Sidebar dùng chung cho học viên -->
    <div id="learnerSidebarContainer"></div>

    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      <!-- Header dùng chung cho học viên -->
      <div id="learnerHeaderContainer"></div>

      <main class="flex-1 overflow-y-auto p-4 sm:p-6 bg-[#F8FAFC] flex flex-col min-w-0">
        <div id="myCoursesRoot" class="max-w-[1100px] w-full mx-auto flex-1 space-y-6 mc-body">

          <!-- ===== DANH SÁCH LỚP (UC-58 bước 1–3) ===== -->
          <section id="myCoursesListView" class="space-y-5">
            <div>
              <h1 class="mc-heading text-[30px] leading-tight">Lớp học của tôi</h1>
              <p class="text-[#444]">Các lớp học gia sư đã mở cho bạn cùng tài liệu học tập được chia sẻ.</p>
            </div>
            <div id="myCoursesState" class="mc-card p-6 text-center hidden"></div>
            <div id="myCoursesGrid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
          </section>

          <!-- ===== CHI TIẾT LỚP (UC-58 bước 4–7, UC-61) ===== -->
          <section id="myCourseDetailView" class="space-y-5 hidden">
            <button type="button" id="myCoursesBackBtn" class="text-[#1F6FB4] font-semibold hover:underline">← Danh sách lớp học</button>

            <div id="myCourseDetailState" class="mc-card p-6 text-center hidden"></div>

            <div id="myCourseDetailCard" class="mc-card p-5 space-y-2 hidden">
              <div class="flex flex-wrap items-center gap-3">
                <h1 id="myCourseTitle" class="mc-heading text-[30px] leading-tight break-words"></h1>
                <span id="myCourseStatus" class="mc-badge"></span>
              </div>
              <p class="text-[#333]">Gia sư: <strong id="myCourseTutor"></strong> · Ngày bắt đầu: <span id="myCourseCreated"></span></p>
              <p id="myCourseReadOnlyNote" class="hidden border border-black rounded-[5px] bg-[#FDEDE8] text-[#BF360C] px-3 py-2">Lớp học đang ở chế độ chỉ xem. Bạn vẫn có thể xem lại các tài liệu đã được chia sẻ.</p>
            </div>

            <div id="myCourseMaterials" class="mc-card p-5 space-y-4 hidden">
              <h2 class="mc-heading text-[20px]">Tài liệu học tập</h2>
              <div id="myCourseMaterialsState" class="text-center text-[#444] py-6 hidden"></div>
              <ul id="myCourseMaterialsList" class="space-y-3"></ul>
            </div>

            <!-- FE-07: Bài tập (UC-63, UC-64, UC-96) -->
            <div id="myCourseAssignments" class="mc-card p-5 space-y-4 hidden">
              <h2 class="mc-heading text-[20px]">Bài tập</h2>
              <div id="myAssignmentsState" class="text-center text-[#444] py-6 hidden"></div>
              <ul id="myAssignmentsList" class="space-y-3"></ul>
            </div>
            <div id="myAssignmentDetail" class="mc-card p-5 space-y-4 hidden"></div>
          </section>

          <p id="myCoursesToast" class="hidden mc-card px-4 py-3 font-semibold text-[#BF360C] bg-[#FDEDE8]" role="status" aria-live="polite"></p>
        </div>

        <!-- Footer dùng chung cho học viên -->
        <div id="learnerFooterContainer"></div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/components/learner-layout/learner-layout.js"></script>
  <script type="module" src="/pages/my-courses/my-courses.js"></script>
</body>
</html>
