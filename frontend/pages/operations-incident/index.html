<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chi tiết sự cố - KizunaTutor</title><link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Serif+JP:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<link rel="stylesheet" href="/styles/variables.css"><link rel="stylesheet" href="/styles/global.css"><link rel="stylesheet" href="/styles/components.css"><link rel="stylesheet" href="/styles/utilities.css"><link rel="stylesheet" href="/styles/admin.css"><link rel="stylesheet" href="/styles/operations.css"><link rel="stylesheet" href="/styles/admin-portal.css">
</head>
<body class="admin-dashboard operations-page">
<a class="skip-link" href="#dashboardMain">Đến nội dung chính</a>
<main id="dashboardMain" class="dashboard-main">
<div id="operationsContent" class="operations-content" aria-busy="true"><div class="operations-page-heading"><span class="role-badge">Quản trị vận hành</span><h1>Chi tiết sự cố</h1><p>Theo dõi diễn biến xử lý, kết quả khắc phục và lịch sử sự cố.</p></div>
<p id="operationsNotice" role="status" tabindex="-1" aria-live="polite">Đang tải dữ liệu…</p><button id="retryLoad" type="button" hidden>Thử tải lại</button>

<a href="/pages/operations-incidents/">Về danh sách sự cố</a><article id="incidentDetail" class="operations-card"></article>
<div id="incidentActions" class="operations-card" hidden>
<label for="commandAction">Thao tác</label><select id="commandAction"></select>
<form id="incidentCommandForm">
<div data-field="assignee"><label for="commandAssignee">Người phụ trách mới</label><select id="commandAssignee"></select></div>
<div data-field="reason"><label for="commandReason">Lý do</label><textarea id="commandReason" maxlength="2000"></textarea></div>
<div data-field="detail"><label for="commandDetail">Diễn biến</label><textarea id="commandDetail" maxlength="10000"></textarea></div>
<div data-field="result"><label for="commandResult">Kết quả khắc phục</label><textarea id="commandResult" maxlength="10000"></textarea></div>
<div data-field="verification"><label for="commandVerification">Cách xác minh phục hồi</label><textarea id="commandVerification" maxlength="10000"></textarea></div>
<button type="submit" class="primary">Xác nhận thao tác</button></form></div>
<a id="recurrenceLink" hidden>Ghi nhận lần tái diễn</a>
<div class="operations-card"><h2>Lịch sử xử lý</h2><div id="incidentEvents"></div><button id="eventPrev" type="button">Trang trước</button><button id="eventNext" type="button">Trang sau</button></div>
</div>
</main>
<script type="module" src="/js/main.js"></script>
<script type="module" src="./operations-incident.js"></script>
</body></html>
