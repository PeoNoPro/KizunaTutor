<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo vận hành - KizunaTutor</title><link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Serif+JP:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<link rel="stylesheet" href="/styles/variables.css"><link rel="stylesheet" href="/styles/global.css"><link rel="stylesheet" href="/styles/components.css"><link rel="stylesheet" href="/styles/utilities.css"><link rel="stylesheet" href="/styles/admin.css"><link rel="stylesheet" href="/styles/operations.css"><link rel="stylesheet" href="/styles/admin-portal.css">
</head>
<body class="admin-dashboard operations-page">
<a class="skip-link" href="#dashboardMain">Đến nội dung chính</a>
<main id="dashboardMain" class="dashboard-main">
<div id="operationsContent" class="operations-content" aria-busy="true"><div class="operations-page-heading"><span class="role-badge">Quản trị vận hành</span><h1>Báo cáo vận hành</h1><p>Danh sách sự cố theo kỳ.</p></div>
<p id="operationsNotice" role="alert" tabindex="-1" hidden></p><button id="retryLoad" type="button" hidden>Thử tải lại</button>

<form id="reportFilters" class="operations-card operations-filters"><label>Từ ngày<input type="date" name="startDate"></label><label>Đến ngày<input type="date" name="endDate"></label><label>Xem sự cố<select id="reportMetric" name="metric"><option value="created">Phát sinh trong kỳ</option><option value="resolved">Được khắc phục trong kỳ</option><option value="open">Chưa đóng đến cuối kỳ</option></select></label><button class="primary" type="submit">Lọc</button></form>
<h2 id="reportCount" class="report-count"></h2><div id="reportItems"></div>
<div class="operations-pagination"><button id="reportPrev" type="button">Trang trước</button><button id="reportNext" type="button">Trang sau</button></div>
</div>
</main>
<script type="module" src="/js/main.js"></script>
<script type="module" src="./operations-reports.js"></script>
</body></html>
