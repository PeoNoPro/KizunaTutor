<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm bài luyện đề - KizunaTutor</title>
  <link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/practice.css?v=20261117">
  <style id="practice-attempt-style">
    .pa-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
    .pa-mondai-title{border:1.5px dashed var(--pr-btn-line);border-radius:16px;padding:18px 22px;font:800 18px/1.4 'Noto Sans JP',system-ui,sans-serif;color:var(--pr-navy);background:#fff}
    .pa-block{background:#F1F5F9;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
    .pa-block>.pr-instruction{background:#fff;font-weight:600}
    .pa-qcard{background:#fff;border-radius:14px;padding:18px 20px;scroll-margin-top:16px;position:relative}
    .pa-flag{position:absolute;top:14px;right:14px;min-height:30px;padding:2px 8px;font-size:12px}
    .pa-flag[aria-pressed=true]{background:#fff6dc;border-color:#d9a300;color:#8a5a00}
    .pa-side{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 24px);overflow-y:auto}
    .pa-exam{display:flex;align-items:center;gap:10px}
    .pa-exam a{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--pr-btn-line);border-radius:10px;color:var(--pr-navy);text-decoration:none}
    .pa-exam strong{font-size:14px;color:var(--pr-navy);line-height:1.35}
    .pa-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .pa-timer{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border-radius:10px;background:#F8FAFC;border:1px solid var(--pr-btn-line);font:700 16px/1 ui-monospace,Consolas,monospace;color:var(--pr-navy)}
    .pa-timer[data-state=low]{color:#b3261e;background:#fde7e5;border-color:#f0b4ae}
    .pa-progress>span{display:flex;justify-content:space-between;font-size:13px;color:var(--pr-muted)}
    .pa-progress b{color:var(--pr-primary)}
    .pa-bar{height:6px;border-radius:999px;background:#E2E8F0;overflow:hidden;margin-top:6px}
    .pa-bar i{display:block;height:100%;background:var(--pr-primary);border-radius:inherit;width:0}
    .pa-sections{display:flex;flex-direction:column;gap:8px}
    .pa-section{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--pr-line);border-radius:12px;background:#fff;font:500 14px/1.3 'Noto Sans JP',system-ui,sans-serif;color:var(--pr-text);cursor:pointer;text-align:left}
    .pa-section[aria-current=true]{border-color:var(--pr-primary);color:var(--pr-primary);background:var(--pr-primary-soft)}
    .pa-section:disabled{cursor:not-allowed;opacity:.65}
    .pa-section small{font:700 11px/1 system-ui,sans-serif;padding:4px 8px;border-radius:6px;background:#F1F5F9;color:var(--pr-muted)}
    .pa-section[data-state=doing] small{background:var(--pr-primary);color:#fff}
    .pa-section[data-state=done] small{background:#1aa37a;color:#fff}
    .pa-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
    .pa-cell{height:36px;border-radius:8px;border:1px solid var(--pr-btn-line);background:#fff;font:600 13px/1 system-ui,sans-serif;color:var(--pr-text);cursor:pointer;position:relative}
    .pa-cell[data-answered=true]{background:var(--pr-primary-soft);border-color:var(--pr-primary-line);color:var(--pr-accent)}
    .pa-cell[data-flagged=true]::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#d9a300}
    .pa-cell[data-result=correct]{background:#e4f4ea;border-color:#9bd1b0;color:#1e7a46}
    .pa-cell[data-result=wrong]{background:#fde7e5;border-color:#f0b4ae;color:#b3261e}
    .pa-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .pa-score{border:1px solid var(--pr-line);border-radius:14px;padding:12px 16px;background:#fff}
    .pa-score span{display:block;font-size:12px;color:var(--pr-muted);font-weight:600}
    .pa-score strong{font-size:22px;color:var(--pr-navy)}
    /* Thanh âm thanh cố định ở đáy vùng làm bài (phần Nghe). */
    .pa-audio{position:sticky;bottom:12px;z-index:6;display:flex;align-items:center;gap:12px;margin-top:8px;padding:10px 16px;border-radius:16px;background:#fff;border:1px solid var(--pr-line);box-shadow:0 10px 30px rgba(15,23,42,.15)}
    .pa-audio[hidden]{display:none}
    .pa-audio strong{display:inline-flex;align-items:center;gap:6px;color:var(--pr-accent);font-size:14px;white-space:nowrap}
    .pa-audio audio{flex:1;min-width:0;height:40px}
    .pa-sub{font-size:12px;color:var(--pr-muted)}
    @media(max-width:1024px){.pa-layout{grid-template-columns:minmax(0,1fr)}.pa-side{position:static;order:-1;max-height:none}.pa-grid{grid-template-columns:repeat(10,1fr)}}
    @media(max-width:520px){.pa-grid{grid-template-columns:repeat(7,1fr)}.pa-audio{flex-wrap:wrap}}
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#334155] antialiased" style="font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div class="flex h-screen overflow-hidden bg-[#F8FAFC]">
    <div id="learnerSidebarContainer"></div>
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      <div id="learnerHeaderContainer"></div>
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 w-full max-w-7xl mx-auto">
        <div data-practice-page="attempt">
          <p id="paNotice" class="pr-notice mb-4" role="alert" hidden></p>
          <div class="pa-layout">
            <section class="flex flex-col gap-4 min-w-0">
              <div id="paResult" class="pr-card flex flex-col gap-3" hidden></div>
              <div id="paSection" class="flex flex-col gap-4"></div>
              <div class="flex justify-between gap-3 flex-wrap">
                <button id="paPrevSection" type="button" class="pr-btn"><span class="material-symbols-outlined">chevron_left</span><span>Phần trước</span></button>
                <button id="paNextSection" type="button" class="pr-btn pr-btn-primary"><span>Phần tiếp theo</span><span class="material-symbols-outlined">chevron_right</span></button>
              </div>
              <div id="paAudio" class="pa-audio" hidden><strong><span class="material-symbols-outlined">volume_up</span>Âm thanh</strong></div>
            </section>
            <aside class="pa-side">
              <div class="pr-card flex flex-col gap-4">
                <div class="pa-exam"><a href="/learner/practice" aria-label="Về Luyện đề"><span class="material-symbols-outlined">arrow_back</span></a><strong id="paTitle">Đang tải bài…</strong></div>
                <div class="pa-actions">
                  <div id="paTimer" class="pa-timer"><span class="material-symbols-outlined">timer</span><span id="paTimerText">--:--</span></div>
                  <button id="paSubmit" type="button" class="pr-btn pr-btn-primary"><span class="material-symbols-outlined">send</span>Nộp bài</button>
                </div>
                <div class="pa-progress"><span><span id="paProgressLabel">Hoàn thành</span><b id="paProgress">0/0</b></span><div class="pa-bar"><i id="paProgressBar"></i></div></div>
                <div id="paSections" class="pa-sections"></div>
                <div class="flex items-center justify-between"><strong class="text-[14px] text-[#0F172A]">Danh sách câu hỏi</strong><span id="paCount" class="pa-sub"></span></div>
                <div id="paGrid" class="pa-grid"></div>
                <button id="paFurigana" type="button" class="pr-btn"><span class="material-symbols-outlined">translate</span><span>Furigana</span></button>
              </div>
            </aside>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/components/learner-layout/learner-layout.js"></script>
  <script type="module" src="/pages/practice-attempt/practice-attempt.js"></script>
</body>
</html>
