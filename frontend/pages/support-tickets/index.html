<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yêu cầu hỗ trợ - KizunaTutor</title>
<link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Serif+JP:wght@400;600;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" media="print" onload="this.media='all'"><link rel="stylesheet" href="/styles/support-utilities.css"><link rel="stylesheet" href="/styles/variables.css"><link rel="stylesheet" href="/styles/global.css"><script src="/js/frame-preload.js"></script><link rel="stylesheet" href="/styles/support-tickets.css">
</head><body class="support-page"><a class="skip-link" href="#supportMain">Đến nội dung chính</a>
<main id="supportMain" class="support-main">
<div id="supportLoading" class="support-loading" role="status" aria-label="Đang tải yêu cầu hỗ trợ"><span></span><span></span><span></span></div>
<div class="support-intro"><a id="supportBack" class="support-back" href="/pages/home/" hidden></a><h1 id="supportTitle">Yêu cầu hỗ trợ</h1><p id="supportLead" class="support-lead"></p></div>
<button id="createTicket" class="primary support-create" type="button" hidden>Gửi yêu cầu hỗ trợ</button>
<p id="supportNotice" role="status" aria-live="polite" tabindex="-1" data-loading="true">Đang xác minh tài khoản…</p><button id="reloadSupport" type="button" hidden>Tải lại dữ liệu</button>
<div id="supportContent" hidden aria-busy="true"><p id="activeCount" class="support-active-count" hidden></p>
<div id="ticketListLayout" class="support-list-layout">

<div class="support-list-main">

<section class="support-card" aria-labelledby="ticketListTitle"><div class="support-list-head"><h2 id="ticketListTitle">Các yêu cầu liên quan</h2><span id="ticketCount" class="support-count"></span></div><div class="support-toolbar"><div id="statusChips" class="support-chips" role="group" aria-label="Lọc theo trạng thái"></div><form id="ticketFilters" class="support-filters" aria-label="Lọc yêu cầu hỗ trợ"><label>Nhóm yêu cầu<select name="category"><option value="">Tất cả nhóm yêu cầu</option></select></label><label id="priorityFilter">Ưu tiên<select name="priority"><option value="">Tất cả mức ưu tiên</option></select></label><label id="assigneeFilter" hidden>Người phụ trách<select name="assignedTo"><option value="">Tất cả nhân viên</option></select></label><button id="clearFilters" type="button" class="support-clear-filters" hidden>Xóa bộ lọc</button></form></div><div id="ticketList"></div><nav id="ticketPaging" aria-label="Phân trang yêu cầu"></nav></section>
</div></div></div></main>
<dialog id="createDialog" class="support-dialog" aria-labelledby="createTitle"><form id="createForm" class="support-dialog-form"><div class="support-dialog-head"><h2 id="createTitle">Gửi yêu cầu hỗ trợ</h2><button id="cancelCreate" class="support-dialog-close" type="button" aria-label="Đóng biểu mẫu">Đóng</button></div>
<div class="support-dialog-body"><label>Nhóm yêu cầu<select name="category" required></select></label><label>Tiêu đề<input name="subject" required maxlength="400" autocomplete="off"><small>Tối đa 200 ký tự.</small></label><label>Nội dung<textarea name="message" rows="4" required></textarea><small>Tối đa 10.000 ký tự. Không gửi mật khẩu hoặc mã xác nhận.</small></label>
<fieldset><legend>Vấn đề này liên quan đến (không bắt buộc)</legend><p class="support-context-help">Chọn buổi học thử, gói hội viên hoặc lần thanh toán đang gặp vấn đề để nhân viên hỗ trợ xem ngay, không phải hỏi lại.</p><label>Liên quan đến<select id="contextType"><option value="">Không liên quan đến mục nào</option><option value="booking">Một buổi học thử</option><option value="membership">Một gói hội viên</option><option value="payment">Một lần thanh toán</option></select></label><label id="contextChoiceLabel" hidden><span id="contextChoiceText">Chọn mục</span><select id="contextChoice"><option value="">Chọn mục</option></select></label><p id="contextNotice" role="status"></p><button id="moreContexts" type="button" hidden>Xem thêm lựa chọn</button></fieldset>
<label>Tệp minh họa (nếu có)<input name="files" type="file" multiple accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"><small>Tối đa 5 tệp JPG, PNG hoặc PDF; mỗi tệp tối đa <span data-attachment-limit>10</span> MB.</small></label><p id="createNotice" role="alert" tabindex="-1"></p></div>
<div class="support-dialog-actions"><button class="primary" type="submit">Gửi yêu cầu</button><button id="cancelCreateFooter" type="button">Hủy</button></div></form></dialog>
<script type="module" src="/pages/support-tickets/support-tickets.js"></script></body></html>
