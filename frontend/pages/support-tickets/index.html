<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yêu cầu hỗ trợ - KizunaTutor</title>
<link rel="icon" type="image/png" href="/assets/logos/kizuna-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Serif+JP:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/styles/variables.css"><link rel="stylesheet" href="/styles/global.css"><link rel="stylesheet" href="/styles/support-tickets.css">
</head><body class="support-page"><a class="skip-link" href="#supportMain">Đến nội dung chính</a>
<main id="supportMain" class="support-main">
<div class="support-intro"><a id="supportBack" class="support-back" href="/pages/home/" hidden></a><h1 id="supportTitle">Yêu cầu hỗ trợ</h1><p id="supportLead" class="support-lead"></p></div>
<button id="createTicket" class="primary support-create" type="button" hidden>Gửi yêu cầu hỗ trợ</button>
<p id="supportNotice" role="status" aria-live="polite" tabindex="-1" data-loading="true">Đang xác minh tài khoản…</p><button id="reloadSupport" type="button" hidden>Tải lại dữ liệu</button>
<div id="supportContent" hidden aria-busy="true"><p id="activeCount" class="support-active-count" hidden></p>
<div id="ticketListLayout" class="support-list-layout">
<div id="ticketTabs" class="support-tabs" role="tablist" aria-label="Nhóm yêu cầu hỗ trợ"></div>
<div class="support-list-main">
<form id="ticketFilters" class="support-filters"><label id="statusFilter">Trạng thái<select name="status"></select></label><label>Nhóm yêu cầu<select name="category"><option value="">Tất cả nhóm yêu cầu</option></select></label><label>Ưu tiên<select name="priority"><option value="">Tất cả mức ưu tiên</option></select></label><label id="assigneeFilter" hidden>Người phụ trách<select name="assignedTo"><option value="">Tất cả nhân viên</option></select></label><button type="submit">Lọc yêu cầu</button></form>
<section class="support-card" role="tabpanel" aria-labelledby="ticketListTitle"><h2 id="ticketListTitle">Các yêu cầu liên quan</h2><div id="ticketList"></div><nav id="ticketPaging" aria-label="Phân trang yêu cầu"></nav></section>
</div></div></div></main>
<dialog id="createDialog" class="support-dialog" aria-labelledby="createTitle"><form id="createForm" class="support-dialog-form"><div class="support-dialog-head"><h2 id="createTitle">Gửi yêu cầu hỗ trợ</h2><button id="cancelCreate" class="support-dialog-close" type="button" aria-label="Đóng biểu mẫu">Đóng</button></div>
<div class="support-dialog-body"><p>Mô tả vấn đề khi sử dụng KizunaTutor.</p><label>Nhóm yêu cầu<select name="category" required></select></label><label>Tiêu đề<input name="subject" required maxlength="400" autocomplete="off"><small>Tối đa 200 ký tự.</small></label><label>Nội dung<textarea name="message" rows="4" required></textarea><small>Tối đa 10.000 ký tự. Không gửi mật khẩu hoặc mã xác nhận.</small></label>
<fieldset><legend>Thông tin liên quan (nếu có)</legend><label>Loại thông tin<select id="contextType"><option value="">Không liên kết</option><option value="booking">Lịch học thử</option><option value="membership">Gói hội viên</option><option value="payment">Thanh toán hội viên</option></select></label><label id="contextChoiceLabel" hidden>Chọn thông tin<select id="contextChoice"><option value="">Chọn thông tin liên quan</option></select></label><p id="contextNotice" role="status"></p><button id="moreContexts" type="button" hidden>Xem thêm lựa chọn</button></fieldset>
<label>Tệp minh họa (nếu có)<input name="files" type="file" multiple accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"><small>Tối đa 5 tệp JPG, PNG hoặc PDF; mỗi tệp tối đa 10 MB.</small></label><p id="createNotice" role="alert" tabindex="-1"></p></div>
<div class="support-dialog-actions"><button class="primary" type="submit">Gửi yêu cầu</button><button id="cancelCreateFooter" type="button">Hủy</button></div></form></dialog>
<script type="module" src="./support-tickets.js"></script></body></html>
