server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  # 1. KẾT NỐI POSTGRESQL (SUPABASE / DBEAVER)
  datasource:
    url: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.dyafiyzmwzmbowkjcnwb
    password: Duchan0868938901@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 2. CẤU HÌNH GMAIL GỬI MÃ XÁC THỰC OTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: kizunatutor@gmail.com
    password: ${MAIL_APP_PASSWORD:swzebavllhderenl} # Google App Password cho kizunatutor@gmail.com
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # 3. CẤU HÌNH THYMELEAF (GIAO DIỆN WEB KIZUNA MASTER SHELL)
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  # 4. CẤU HÌNH GOOGLE OAUTH2 (ĐĂNG NHẬP / ĐĂNG KÝ GMAIL)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1029384756-kizunatutor-google-client.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:GOCSPX-kizuna-tutor-secret}
            scope: email,profile,openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# 5. CẤU HÌNH BẢO MẬT JWT (HMAC-SHA256 256-BIT)
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 giờ

  # 6. CẤU HÌNH SEEDER DỮ LIỆU KANJI (KANJIVG)
  seeder:
    kanji:
      enabled: true
      batch-size: 500

  # 7. CẤU HÌNH AGENT MEMORY (TENCENTDB AGENT MEMORY MICROSERVICE)
