<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar" id="academicSidebar" class="w-64 min-w-[16rem] bg-white border-r border-slate-200 h-screen sticky top-0 flex flex-col justify-between z-30 transition-transform duration-200 ease-in-out md:translate-x-0">
    <div class="p-4 sm:p-5 flex-1 overflow-y-auto">
        <div class="px-2 py-1 text-[11px] font-bold tracking-wider text-teal-700 uppercase mb-3">
            HỌC VỤ &amp; KHẢO THÍ CHUẨN SƯ PHẠM
        </div>

        <nav class="space-y-1">
            <a th:href="@{/academic/dashboard}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'dashboard'} ? 'bg-teal-700 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-teal-800 hover:bg-teal-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📊</span>
                    <span>Tổng Quan Học Vụ</span>
                </div>
            </a>

            <a th:href="@{/academic/curriculum-kanji}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'curriculum-kanji'} ? 'bg-teal-700 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-teal-800 hover:bg-teal-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📖</span>
                    <span>Thẩm Định Giáo Trình Kanji</span>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-teal-100 text-teal-800 border border-teal-200">
                    JLPT
                </span>
            </a>

            <a th:href="@{/academic/academic-records}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'academic-records'} ? 'bg-teal-700 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-teal-800 hover:bg-teal-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">🎯</span>
                    <span>Chuẩn Đầu Ra &amp; Khảo Thí</span>
                </div>
            </a>
        </nav>
    </div>

    <div class="p-4 border-t border-teal-100 bg-teal-50/30">
        <div class="text-[11px] text-teal-900 font-bold">Ban Học Vụ KizunaTutor</div>
        <div class="text-[10px] text-slate-500">Khung kiểm định JLPT N5 - N1</div>
    </div>
</aside>
</html>
