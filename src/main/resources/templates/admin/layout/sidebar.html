<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar" id="adminSidebar" class="w-64 min-w-[16rem] bg-white border-r border-slate-200 h-screen sticky top-0 flex flex-col justify-between z-30 transition-transform duration-200 ease-in-out md:translate-x-0">
    <div class="p-4 sm:p-5 flex-1 overflow-y-auto">
        <div class="px-2 py-1 text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-3">
            QUẢN TRỊ TOÀN HỆ THỐNG
        </div>

        <nav class="space-y-1">
            <!-- 1. Tổng quan hệ thống -->
            <a th:href="@{/admin/dashboard}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'dashboard'} ? 'bg-slate-900 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100/80'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📊</span>
                    <span>Tổng Quan Hệ Thống</span>
                </div>
            </a>

            <!-- 2. Quản trị kho dữ liệu Kanji -->
            <a th:href="@{/admin/kanji-management}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'kanji-management'} ? 'bg-slate-900 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100/80'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">⚙️</span>
                    <span>Quản Trị Dữ Liệu Kanji</span>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-slate-100 text-slate-600 border border-slate-200 group-hover:bg-slate-200">
                    Gốc
                </span>
            </a>

            <!-- 3. Quản lý tài khoản người dùng -->
            <a th:href="@{/admin/users}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'users'} ? 'bg-slate-900 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100/80'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">👥</span>
                    <span>Quản Lý User &amp; Role</span>
                </div>
            </a>

            <!-- 4. Cấu hình hệ thống & AI -->
            <a href="#"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 transition-all group">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">⚡</span>
                    <span>Cấu Hình Nền Tảng &amp; AI</span>
                </div>
            </a>
        </nav>
    </div>

    <!-- Footer Sidebar: Thông tin Quản Trị Viên & Đăng xuất -->
    <div class="p-3 border-t border-slate-100 bg-slate-50/50">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs" th:text="${avatarText != null ? avatarText : 'AD'}">AD</div>
                <div class="text-xs leading-tight">
                    <div class="font-bold text-slate-900 truncate max-w-[100px]" th:text="${userName != null ? userName : 'System Admin'}">System Admin</div>
                    <div class="text-[10px] text-slate-500">Quản trị viên</div>
                </div>
            </div>
            <button type="button"
                    data-action="logout"
                    onclick="executeLogout()"
                    class="text-xs text-slate-600 hover:text-red-700 font-bold px-2 py-1 rounded-md hover:bg-red-50 transition-all cursor-pointer flex items-center gap-1"
                    title="Đăng xuất khỏi hệ thống">
                <span>🚪</span><span>Thoát</span>
            </button>
        </div>
    </div>
</aside>
</html>
