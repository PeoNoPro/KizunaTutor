<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Đăng Nhập - KizunaTutor</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 60px auto;
            background: #FFFFFF;
            padding: 36px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-md);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="auth-container">
        <h2 style="color: var(--color-primary); margin-bottom: 8px; text-align: center;">Đăng Nhập</h2>
        <p style="color: var(--color-text-muted); font-size: 14px; text-align: center; margin-bottom: 24px;">Chào mừng bạn trở lại với KizunaTutor</p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email hoặc Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="example@kizuna-nihongo.vn" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Đăng Nhập</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--color-text-muted);">
            Chưa có tài khoản? <a th:href="@{/register}" style="color: var(--color-primary); font-weight: 600;">Đăng ký ngay</a>
        </p>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
