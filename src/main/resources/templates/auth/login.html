<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Đăng Nhập - KizunaTutor</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <style>
        .auth-card-master {
            max-width: 440px;
            margin: var(--space-8) auto;
            background: #FFFFFF;
            padding: 36px 32px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- ========================================================================= -->
    <!-- GLOBAL MASTER SHELL (FIGMA NODE 1148-501 STANDARD) -->
    <!-- ========================================================================= -->
    <div class="app-shell">

        <!-- THANH ĐIỀU HƯỚNG BÊN (SIDEBAR NAVIGATION RAIL) -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- VÙNG NỘI DUNG CHÍNH (APP MAIN CONTAINER) -->
        <div class="app-main">

            <!-- THANH ĐIỀU HƯỚNG TRÊN CÙNG (TOP NAVIGATION HEADER 64PX) -->
            <div th:replace="~{fragments/topbar :: topbar}"></div>

            <!-- NỘI DUNG MÀN HÌNH (MAIN CONTENT CANVAS MAX-W-7XL) -->
            <main class="app-content">

                <!-- TIÊU ĐỀ TRANG CHUẨN MASTER LAYOUT -->
                <div class="page-header">
                    <div class="page-breadcrumbs">
                        <a th:href="@{/}">Trang chủ</a>
                        <span class="sep">/</span>
                        <a th:href="@{/login}">Tài khoản</a>
                        <span class="sep">/</span>
                        <span>Đăng nhập</span>
                    </div>
                </div>

                <div class="auth-card-master">
                    <div style="text-align: center; margin-bottom: 24px;">
                        <div class="sidebar-brand-badge" style="width: 44px; height: 44px; font-size: 22px; margin: 0 auto 12px auto;">絆</div>
                        <h2 style="color: var(--color-primary); margin: 0 0 6px 0; font-size: 22px; font-weight: 800;">Đăng Nhập Tài Khoản</h2>
                        <p style="color: var(--color-text-secondary); font-size: 13.5px; margin: 0;">Chào mừng bạn trở lại với không gian học tập KizunaTutor</p>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <label>Địa chỉ Email hoặc Tên đăng nhập</label>
                            <input type="text" name="username" class="search-input" placeholder="vidu@kizuna-nihongo.vn" required style="width: 100%;">
                        </div>
                        <div class="form-group">
                            <label>Mật khẩu bảo mật</label>
                            <input type="password" name="password" class="search-input" placeholder="••••••••" required style="width: 100%;">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; font-size: 14px; margin-top: 4px;">
                            Đăng Nhập
                        </button>
                    </form>

                    <p style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--color-text-secondary);">
                        Chưa có tài khoản học tập? <a th:href="@{/register}" style="color: var(--color-secondary); font-weight: 700; text-decoration: none;">Đăng ký ngay</a>
                    </p>
                </div>

            </main>


        </div>
    </div>

</body>
</html>
