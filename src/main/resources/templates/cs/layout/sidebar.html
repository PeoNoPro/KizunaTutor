<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar" id="csSidebar" class="w-64 min-w-[16rem] shrink-0 bg-white border-r border-slate-200 h-screen sticky top-0 flex flex-col justify-between z-30 transition-transform duration-200 ease-in-out md:translate-x-0">
    <div class="p-4 sm:p-5 flex-1 overflow-y-auto">
        <div class="px-2 py-1 text-[11px] font-bold tracking-wider text-purple-600 uppercase mb-3">
            DỊCH VỤ &amp; HỖ TRỢ HỌC VIÊN
        </div>

        <nav class="space-y-1">
            <a th:href="@{/cs/dashboard}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'dashboard'} ? 'bg-purple-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-purple-700 hover:bg-purple-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📊</span>
                    <span>Tổng Quan CSKH</span>
                </div>
            </a>

            <a th:href="@{/cs/student-support-progress}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'student-support-progress'} ? 'bg-purple-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-purple-700 hover:bg-purple-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">🛎️</span>
                    <span>Hỗ Trợ &amp; Cảnh Báo</span>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-purple-100 text-purple-700 border border-purple-200">
                    Hỗ Trợ
                </span>
            </a>

            <a href="#"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-purple-700 hover:bg-purple-50/60 transition-all group">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">🎁</span>
                    <span>Lịch Học Thử 1:1</span>
                </div>
            </a>
        </nav>
    </div>

    <!-- Footer Sidebar: Thông tin CSKH & Đăng xuất -->
    <div class="p-3 border-t border-purple-100 bg-purple-50/40">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-xs" th:text="${avatarText != null ? avatarText : 'CS'}">CS</div>
                <div class="text-xs leading-tight">
                    <div class="font-bold text-slate-900 truncate max-w-[100px]" th:text="${userName != null ? userName : 'CS Staff'}">CS Staff</div>
                    <div class="text-[10px] text-purple-700 font-medium">Chăm sóc khách hàng</div>
                </div>
            </div>
            <button type="button"
                    data-action="logout"
                    onclick="executeLogout()"
                    class="text-xs text-slate-600 hover:text-red-700 font-bold px-2 py-1 rounded-md hover:bg-red-50 transition-all cursor-pointer flex items-center gap-1"
                    title="Đăng xuất khỏi hệ thống">
                <span>🚪</span><span>Thoát</span>
            </button>
        </div>
    </div>
</aside>
</html>
