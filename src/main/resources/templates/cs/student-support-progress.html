<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Hỗ Trợ Học Viên &amp; Cảnh Báo - KizunaTutor CS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
</head>
<body class="bg-[#FAF9F6] text-[#0F172A] font-sans antialiased overflow-hidden">
    <div class="flex h-screen overflow-hidden bg-[#FAF9F6]">
        <aside th:replace="~{cs/layout/sidebar :: sidebar}"></aside>
        <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
            <header th:replace="~{cs/layout/header :: header}"></header>

            <main class="flex-1 overflow-y-auto p-3 sm:p-4 bg-[#FAF9F6]">
                <div class="max-w-7xl mx-auto space-y-3">
                    <!-- SLIM HERO BANNER (CHUẨN HOÁ TOÀN HỆ THỐNG) -->
                    <div class="card-retro bg-white border border-black rounded-[5px] shadow-[3px_3px_0px_0px_#000000] px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="inline-block px-1.5 py-0.5 text-[10px] font-bold bg-[#E0399A] text-white border border-black rounded-[3px] shadow-[1px_1px_0px_0px_#000000]">HỖ TRỢ</span>
                                <h1 class="text-lg sm:text-xl font-black text-[#0F172A] tracking-tight font-['Itim',cursive]">
                                    Danh Sách Học Viên Cần Hỗ Trợ &amp; Cảnh Báo Bỏ Bài
                                </h1>
                            </div>
                            <p class="text-xs text-[#475569] font-['Segoe_UI',sans-serif]">Chủ động gọi điện, nhắn tin hỗ trợ khi học viên gặp khó khăn trong bài tập hoặc vắng buổi học kèm.</p>
                        </div>
                    </div>

                    <div class="card-retro bg-white border border-black rounded-[5px] p-6 shadow-[3px_3px_0px_0px_#000000] text-xs">
                        <div class="py-6 text-center text-slate-400">
                            <div class="text-3xl mb-2">🎉</div>
                            <div class="font-bold text-[#0F172A] text-sm">Hiện không có học viên nào cần can thiệp hỗ trợ</div>
                            <div class="text-xs text-[#475569] mt-1">Hệ thống sẽ tự động thông báo khi có học viên vắng học hoặc gặp trở ngại trong bài tập.</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/js/authRedirect.js}"></script>
</body>
</html>
