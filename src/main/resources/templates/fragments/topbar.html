<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="topbar" class="app-topbar">
    <div class="topbar-left">
        <!-- Nút bật/tắt Sidebar trên di động hoặc màn hình nhỏ -->
        <button type="button" class="topbar-toggle-btn" id="btnToggleSidebar" aria-label="Mở/Đóng thanh điều hướng" onclick="toggleAppSidebar()">
            ☰
        </button>

        <!-- Ô Tìm Kiếm Nhanh Toàn Hệ Thống -->
        <div class="topbar-search-box">
            <span class="topbar-search-icon">🔍</span>
            <input type="text" class="topbar-search-input" placeholder="Tìm nhanh kanji, bài học, gia sư..." id="globalSearchInput" onkeydown="handleGlobalSearch(event)">
            <span class="topbar-kbd">⌘K</span>
        </div>
    </div>

    <!-- Phía phải: Khối điều hướng động theo trạng thái tài khoản -->
    <div class="topbar-right" id="topbarRightNav">
        <a th:href="@{/login}" class="btn btn-outline" style="padding: 6px 14px; font-size: 13px; text-decoration: none;" id="navLoginBtn">
            <span>🔑</span> <span>Đăng Nhập</span>
        </a>
    </div>

    <!-- Script điều khiển toggle sidebar di động & phím tắt tìm kiếm toàn cục -->
    <script>
        function toggleAppSidebar() {
            const sidebar = document.getElementById('appSidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
            }
        }

        // Lắng nghe phím tắt Ctrl+K hoặc Cmd+K
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const searchInput = document.getElementById('globalSearchInput');
                if (searchInput) searchInput.focus();
            }
        });

        function handleGlobalSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (query) {
                    window.location.href = '/kanji?charQuery=' + encodeURIComponent(query);
                }
            }
        }

        // Hiển thị thông tin người dùng động nếu đã đăng nhập phiên
        (function() {
            try {
                const raw = localStorage.getItem('kizuna_user');
                if (raw) {
                    const user = JSON.parse(raw);
                    const container = document.getElementById('topbarRightNav');
                    if (container && user) {
                        const initials = user.fullName ? user.fullName.split(' ').map(n => n[0]).slice(-2).join('').toUpperCase() : 'KZ';
                        const roleBadge = user.roleBadge || 'Tài khoản';
                        const dashboardRoutes = {
                            ROLE_ADMIN: '/admin/dashboard',
                            ROLE_MANAGER: '/manager/dashboard',
                            ROLE_CS_STAFF: '/cs/dashboard',
                            ROLE_ACADEMIC_OFFICER: '/academic/dashboard',
                            ROLE_TUTOR: '/tutor/dashboard',
                            ROLE_LEARNER: '/learner/dashboard'
                        };
                        const targetRoute = dashboardRoutes[user.role] || '/login';
                        container.innerHTML = `
                            <a href="${targetRoute}" class="topbar-user-pill" style="text-decoration: none; cursor: pointer;" title="Vào không gian làm việc của bạn">
                                <div class="topbar-avatar">${initials}</div>
                                <span class="topbar-user-name">${user.fullName || 'Tài khoản'}</span>
                                <span class="topbar-role-tag">${roleBadge}</span>
                            </a>
                            <button onclick="if(typeof handleLogout==='function'){handleLogout();}else{localStorage.clear();window.location.href='/login';}" class="btn btn-outline" style="padding: 5px 10px; font-size: 12px; cursor: pointer;" title="Đăng xuất">
                                🚪
                            </button>
                        `;
                    }
                }
            } catch(e) {}
        })();
    </script>
</header>
</html>
