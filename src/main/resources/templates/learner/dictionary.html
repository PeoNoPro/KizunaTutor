<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Từ Điển Kanji Học Tập - KizunaTutor Learner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div class="flex min-h-screen">
        <!-- Sidebar Learner -->
        <aside th:replace="~{learner/layout/sidebar :: sidebar}"></aside>

        <div class="flex-1 flex flex-col min-w-0">
            <!-- Header Learner -->
            <header th:replace="~{learner/layout/header :: header}"></header>

            <main class="flex-1 p-6 sm:p-8 bg-slate-50">
                <div class="max-w-7xl mx-auto space-y-6">
                    <!-- Page Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-emerald-100">
                        <div>
                            <div class="text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-1">Tra Cứu Học Tập Cá Nhân</div>
                            <h1 class="text-xl font-extrabold text-slate-900">Từ Điển Chữ Hán Kanji Cá Nhân Hóa</h1>
                            <p class="text-xs text-slate-500">Tra cứu nhanh hơn 6.600 chữ Hán, xem giải nghĩa, lưu vào bộ Flashcard và tập viết trực tiếp.</p>
                        </div>
                        <a th:href="@{/learner/practice-canvas}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition-colors shadow-xs">
                            <span>✍️</span> Vào Bảng Vẽ Luyện Viết
                        </a>
                    </div>

                    <!-- Search Controls -->
                    <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs flex flex-wrap gap-3 items-center justify-between">
                        <div class="flex flex-1 items-center gap-3 min-w-[280px]">
                            <input type="text" id="learnerSearchInput" oninput="debounceLearnerSearch()" th:value="${keyword}" placeholder="🔍 Nhập chữ Hán, âm Hán Việt (Ái, Hòa, Tâm) hoặc nghĩa tiếng Việt..." class="flex-1 px-3.5 py-2 text-xs rounded-lg border border-slate-200 bg-slate-50 text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
                            <select id="learnerJlptSelect" onchange="loadLearnerDictionary(0)" class="px-3 py-2 text-xs rounded-lg border border-slate-200 bg-slate-50 text-slate-700 font-semibold focus:outline-none">
                                <option value="ALL">Tất cả cấp độ JLPT</option>
                                <option value="N5">Cấp độ N5 (Căn bản)</option>
                                <option value="N4">Cấp độ N4 (Sơ cấp)</option>
                                <option value="N3">Cấp độ N3 (Trung cấp)</option>
                                <option value="N2">Cấp độ N2 (Thượng cấp)</option>
                                <option value="N1">Cấp độ N1 (Chuyên sâu)</option>
                            </select>
                        </div>
                        <div class="text-xs text-slate-500" id="learnerTotalLabel">
                            Kho từ điển: <strong class="text-slate-900" th:text="${totalDictionaryCount != null ? totalDictionaryCount : '6,600+'}">6,600+</strong> chữ
                        </div>
                    </div>

                    <!-- Flash Message Alert -->
                    <div id="learnerAlertBox" style="display: none;" class="p-3.5 rounded-xl border text-xs font-semibold"></div>

                    <!-- Dictionary Cards Grid -->
                    <div id="learnerKanjiGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4">
                        <!-- Dynamic Kanji Dictionary Cards -->
                    </div>

                    <!-- Pagination -->
                    <div class="flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200/80 text-xs">
                        <span id="learnerPaginationInfo" class="text-slate-500">Đang tải từ điển...</span>
                        <div class="flex items-center gap-1.5" id="learnerPaginationBtns"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Thêm Chữ Vào Bộ Thẻ Của Học Viên -->
    <div id="modalAddToDeck" style="display: none;" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-200 space-y-4 text-xs">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="text-sm font-bold text-slate-900">Lưu Chữ Vào Bộ Thẻ Cá Nhân</h3>
                <button type="button" onclick="closeDeckModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
            </div>

            <div class="text-center py-2">
                <div id="modalDeckChar" class="font-serif text-5xl font-extrabold text-emerald-700">愛</div>
                <div id="modalDeckHanViet" class="text-xs font-bold text-slate-800 mt-1 uppercase">ÁI</div>
            </div>

            <form onsubmit="submitSaveToDeck(event)" class="space-y-3">
                <input type="hidden" id="modalDeckKanjiId">
                <input type="hidden" id="modalDeckCharInput">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Chọn Thư Mục / Bộ Thẻ:</label>
                    <select id="modalDeckSelect" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-slate-700 font-semibold focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        <option value="Từ vựng bài 1 - 5 (Minna)">Từ vựng bài 1 - 5 (Minna)</option>
                        <option value="Kanji N3 Trọng Tâm">Kanji N3 Trọng Tâm</option>
                        <option value="Bộ Thẻ Yêu Thích">Bộ Thẻ Yêu Thích</option>
                    </select>
                </div>
                <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeDeckModal()" class="px-4 py-2 rounded-lg border border-slate-200 font-bold text-slate-600 hover:bg-slate-100">Hủy</button>
                    <button type="submit" id="btnConfirmSaveDeck" class="px-5 py-2 rounded-lg bg-emerald-600 text-white font-bold hover:bg-emerald-700 shadow-xs">Lưu Ngay</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/authRedirect.js}"></script>
    <script>
        let currentLearnerPage = 0;
        let learnerDebounce = null;

        function toggleSidebar() {
            const sb = document.getElementById('learnerSidebar');
            if (sb) sb.classList.toggle('-translate-x-full');
        }

        function debounceLearnerSearch() {
            clearTimeout(learnerDebounce);
            learnerDebounce = setTimeout(() => {
                loadLearnerDictionary(0);
            }, 300);
        }

        async function loadLearnerDictionary(page = 0) {
            currentLearnerPage = page;
            const kw = document.getElementById('learnerSearchInput').value.trim();
            const jlpt = document.getElementById('learnerJlptSelect').value;
            const grid = document.getElementById('learnerKanjiGrid');
            grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-xs">Đang tra cứu từ điển Kanji...</div>';

            try {
                const res = await fetch(`/api/learner/kanji/search?page=${page}&size=18&keyword=${encodeURIComponent(kw)}&jlpt=${encodeURIComponent(jlpt)}`);
                const data = await res.json();
                renderLearnerGrid(data.items || []);
                renderLearnerPagination(data.currentPage, data.totalPages, data.totalElements);
            } catch(e) {
                grid.innerHTML = '<div class="col-span-full py-12 text-center text-rose-500 text-xs font-bold">Lỗi kết nối từ điển: ' + e.message + '</div>';
            }
        }

        function renderLearnerGrid(items) {
            const grid = document.getElementById('learnerKanjiGrid');
            if (!items || items.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-xs">Không tìm thấy chữ Kanji nào phù hợp với từ khóa của bạn.</div>';
                return;
            }

            grid.innerHTML = items.map(k => `
                <div class="bg-white rounded-xl border border-slate-200/80 p-5 shadow-xs hover:border-emerald-300 transition-all flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">${k.jlpt}</span>
                            <span class="text-[11px] text-slate-400 font-semibold">${k.strokeCount || 1} nét bút</span>
                        </div>

                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-16 h-16 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center font-serif text-4xl font-extrabold text-slate-900 shadow-2xs">
                                ${k.kanjiChar}
                            </div>
                            <div class="flex-1">
                                <div class="text-sm font-extrabold text-emerald-800 uppercase tracking-wide">${k.hanViet}</div>
                                <div class="text-[11px] text-slate-500 font-mono mt-1">On: ${k.onyomi || '-'}</div>
                                <div class="text-[11px] text-slate-500 font-mono">Kun: ${k.kunyomi || '-'}</div>
                            </div>
                        </div>

                        <div class="p-2.5 rounded-lg bg-slate-50 text-slate-600 text-[11px] leading-relaxed line-clamp-2" title="${k.meaning}">
                            ${k.meaning || 'Chưa có chú giải nghĩa'}
                        </div>
                    </div>

                    <div class="pt-4 mt-3 border-t border-slate-100 flex items-center gap-2">
                        <button type="button" onclick="openSaveDeckModal('${k.id}', '${k.kanjiChar}', '${k.hanViet}')" class="flex-1 py-1.5 px-2 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-semibold flex items-center justify-center gap-1 transition-colors">
                            <span>📁</span> Lưu Thẻ
                        </button>
                        <a href="/learner/practice-canvas?char=${encodeURIComponent(k.kanjiChar)}" class="flex-1 py-1.5 px-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center justify-center gap-1 transition-colors shadow-2xs no-underline">
                            <span>✍️</span> Luyện Viết
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function renderLearnerPagination(page, totalPages, totalElements) {
            const info = document.getElementById('learnerPaginationInfo');
            const btns = document.getElementById('learnerPaginationBtns');
            if (info) info.innerHTML = `Trang <strong>${page + 1}</strong> / <strong>${totalPages}</strong> (${totalElements} chữ)`;
            if (!btns) return;

            let html = '';
            html += `<button type="button" ${page === 0 ? 'disabled' : ''} onclick="loadLearnerDictionary(${page - 1})" class="px-2.5 py-1 rounded border border-slate-200 font-semibold disabled:opacity-40 hover:bg-slate-100">◀</button>`;
            html += `<span class="px-2 py-1 text-slate-600 font-bold">${page + 1}</span>`;
            html += `<button type="button" ${page >= totalPages - 1 ? 'disabled' : ''} onclick="loadLearnerDictionary(${page + 1})" class="px-2.5 py-1 rounded border border-slate-200 font-semibold disabled:opacity-40 hover:bg-slate-100">▶</button>`;
            btns.innerHTML = html;
        }

        function openSaveDeckModal(id, char, hanViet) {
            document.getElementById('modalDeckKanjiId').value = id;
            document.getElementById('modalDeckCharInput').value = char;
            document.getElementById('modalDeckChar').textContent = char;
            document.getElementById('modalDeckHanViet').textContent = hanViet;
            document.getElementById('modalAddToDeck').style.display = 'flex';
        }

        function closeDeckModal() {
            document.getElementById('modalAddToDeck').style.display = 'none';
        }

        async function submitSaveToDeck(e) {
            e.preventDefault();
            const btn = document.getElementById('btnConfirmSaveDeck');
            btn.disabled = true;
            btn.textContent = 'Đang lưu...';

            const payload = {
                kanjiId: document.getElementById('modalDeckKanjiId').value,
                kanjiChar: document.getElementById('modalDeckCharInput').value,
                targetDeckName: document.getElementById('modalDeckSelect').value
            };

            try {
                const res = await fetch('/api/learner/kanji/save-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                closeDeckModal();
                showAlert(data.message || 'Lưu thành công!', true);
            } catch(err) {
                showAlert('Lỗi: ' + err.message, false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Lưu Ngay';
            }
        }

        function showAlert(msg, isSuccess) {
            const box = document.getElementById('learnerAlertBox');
            box.style.display = 'block';
            box.style.background = isSuccess ? '#ECFDF5' : '#FEF2F2';
            box.style.borderColor = isSuccess ? '#A7F3D0' : '#FECACA';
            box.style.color = isSuccess ? '#065F46' : '#991B1B';
            box.textContent = msg;
            setTimeout(() => { box.style.display = 'none'; }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLearnerDictionary(0);
        });
    </script>
</body>
</html>
