<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="h-16 bg-white border-b border-emerald-100 sticky top-0 z-40 px-4 sm:px-8 flex items-center justify-between shadow-xs">
    <!-- Nạp script xác thực và xử lý đăng xuất toàn cục -->
    <script th:src="@{/js/globalAuth.js}"></script>

    <!-- Phía trái: Logo KizunaTutor Học Viên -->
    <div class="flex items-center gap-3 sm:gap-6">
        <button type="button" class="md:hidden p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100" onclick="toggleSidebar()">
            ☰
        </button>
        <a th:href="@{/learner/dashboard}" class="flex items-center gap-2.5 no-underline group" title="KizunaTutor Học Viên">
            <div class="w-8 h-8 rounded-lg bg-emerald-600 text-white font-bold flex items-center justify-center font-serif text-base shadow-xs group-hover:bg-emerald-700 transition-colors">
                絆
            </div>
            <div class="font-extrabold text-lg text-slate-900 tracking-tight">
                Kizuna<span class="text-emerald-600">Learner</span>
            </div>
        </a>
    </div>

    <!-- Phía giữa: Breadcrumbs Học Viên -->
    <div class="hidden lg:flex items-center gap-2 text-xs font-medium text-slate-500">
        <a th:href="@{/learner/dashboard}" class="hover:text-slate-800 transition-colors">Không Gian Của Tôi</a>
        <span>/</span>
        <span class="text-slate-400">Học Tập &amp; Luyện Viết</span>
        <span>/</span>
        <span class="text-emerald-700 font-semibold" th:text="${breadcrumbSection != null ? breadcrumbSection : 'Tổng Quan'}">Tổng Quan</span>
    </div>

    <!-- Phía phải: Khối định danh Học Viên (Emerald Badge) -->
    <div class="flex items-center gap-3 sm:gap-4">
        <span class="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-xs tracking-wide">
            Học Viên
        </span>

        <div class="flex items-center gap-2.5 pl-1 sm:pl-2 border-l border-slate-200/80">
            <div class="w-8 h-8 rounded-full bg-emerald-600 text-white text-xs font-bold flex items-center justify-center shadow-xs" th:text="${avatarText}">
                HV
            </div>
            <div class="hidden sm:block text-left leading-tight">
                <div class="text-xs font-bold text-slate-900" th:text="${userName}">Học Viên Kizuna</div>
                <div class="text-[11px] text-slate-500" th:text="${userEmail}">learner@kizuna.vn</div>
            </div>
        </div>

        <button type="button"
                id="logoutBtn"
                data-action="logout"
                onclick="executeLogout()"
                class="btn-logout inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-red-700 bg-slate-100/80 hover:bg-red-50 border border-slate-200 transition-all cursor-pointer shadow-2xs"
                title="Đăng xuất khỏi hệ thống">
            <span>🚪</span>
            <span class="hidden sm:inline">Đăng Xuất</span>
        </button>
    </div>
</header>
</html>
