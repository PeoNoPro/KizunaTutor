<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- HEADER TINH GỌN (CHỈ DÀNH CHO MOBILE ĐỂ MỞ MENU, ẨN HOÀN TOÀN TRÊN DESKTOP) -->
<header th:fragment="header" class="md:hidden h-11 bg-white border-b border-black sticky top-0 z-40 px-3 flex items-center justify-between font-sans shadow-[0px_2px_0px_0px_#0F172A]">
    <!-- Nạp script cấu hình Tailwind và Xác thực toàn cục -->
    <script th:src="@{/js/shared/tailwind-nhai-config.js}"></script>
    <script th:src="@{/js/globalAuth.js}"></script>
    <script th:src="@{/js/shared/kizunaDialog.js}"></script>
    <script th:src="@{/js/common/kizunaToast.js}"></script>

    <div class="flex items-center gap-2">
        <button type="button" class="p-1 rounded-[5px] border border-black text-slate-800 bg-white hover:bg-slate-100 shadow-[1.5px_1.5px_0px_0px_#0F172A] active:translate-x-[0.5px] active:translate-y-[0.5px] active:shadow-none" onclick="toggleSidebar()" title="Mở danh mục menu">
            ☰
        </button>
        <span class="font-['Itim'] font-bold text-base text-[#0F172A]">Kizuna<span class="text-[#E0399A]">Learner</span></span>
    </div>
</header>
</html>
