<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar" id="learnerSidebar" class="w-64 min-w-[16rem] bg-white border-r border-slate-200 h-screen sticky top-0 flex flex-col justify-between z-30 transition-transform duration-200 ease-in-out md:translate-x-0">
    <div class="p-4 sm:p-5 flex-1 overflow-y-auto">
        <div class="px-2 py-1 text-[11px] font-bold tracking-wider text-emerald-600 uppercase mb-3">
            KHÔNG GIAN HỌC TẬP CỦA TÔI
        </div>

        <nav class="space-y-1">
            <!-- 1. Tổng quan học tập -->
            <a th:href="@{/learner/dashboard}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'dashboard'} ? 'bg-emerald-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-emerald-700 hover:bg-emerald-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📊</span>
                    <span>Tổng Quan Học Tập</span>
                </div>
            </a>

            <!-- 2. Tra cứu từ điển Kanji học tập -->
            <a th:href="@{/learner/dictionary}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'dictionary'} ? 'bg-emerald-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-emerald-700 hover:bg-emerald-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📚</span>
                    <span>Tra Cứu Từ Điển Kanji</span>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">
                    Tra cứu
                </span>
            </a>

            <!-- 3. Luyện viết chữ Canvas AI -->
            <a th:href="@{/learner/practice-canvas}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'practice-canvas'} ? 'bg-emerald-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-emerald-700 hover:bg-emerald-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">✍️</span>
                    <span>Luyện Viết Shodo AI</span>
                </div>
            </a>

            <!-- 4. Bộ thẻ của tôi -->
            <a th:href="@{/kanji?tab=folders}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-emerald-700 hover:bg-emerald-50/60 transition-all group">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📁</span>
                    <span>Bộ Thẻ Của Tôi</span>
                </div>
            </a>

            <!-- 5. Nhật ký tiến độ -->
            <a th:href="@{/learner/my-progress}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'my-progress'} ? 'bg-emerald-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-emerald-700 hover:bg-emerald-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📈</span>
                    <span>Nhật Ký Tiến Độ</span>
                </div>
            </a>
        </nav>
    </div>

    <!-- Footer Sidebar -->
    <div class="p-4 border-t border-emerald-100 bg-emerald-50/30">
        <div class="text-[11px] text-emerald-800 font-bold">Lộ Trình: Mục tiêu JLPT N3</div>
        <div class="text-[10px] text-slate-500">Gia sư đồng hành: Yamada Kenji Sensei</div>
    </div>
</aside>
</html>
