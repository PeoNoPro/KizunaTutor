<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar" id="managerSidebar" class="w-64 min-w-[16rem] bg-white border-r border-slate-200 h-screen sticky top-0 flex flex-col justify-between z-30 transition-transform duration-200 ease-in-out md:translate-x-0">
    <div class="p-4 sm:p-5 flex-1 overflow-y-auto">
        <div class="px-2 py-1 text-[11px] font-bold tracking-wider text-blue-600 uppercase mb-3">
            GIÁM SÁT VẬN HÀNH &amp; KINH DOANH
        </div>

        <nav class="space-y-1">
            <a th:href="@{/manager/dashboard}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'dashboard'} ? 'bg-blue-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-blue-700 hover:bg-blue-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📊</span>
                    <span>Tổng Quan Vận Hành</span>
                </div>
            </a>

            <a th:href="@{/manager/learning-analytics}"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all group"
               th:classappend="${activeMenu == 'learning-analytics'} ? 'bg-blue-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-blue-700 hover:bg-blue-50/60'">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">📈</span>
                    <span>Báo Cáo Hiệu Quả Đào Tạo</span>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-blue-100 text-blue-700 border border-blue-200">
                    KPIs
                </span>
            </a>

            <a href="#"
               class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-blue-700 hover:bg-blue-50/60 transition-all group">
                <div class="flex items-center gap-2.5">
                    <span class="text-base">👨‍🏫</span>
                    <span>Điều Phối Gia Sư &amp; Lớp</span>
                </div>
            </a>
        </nav>
    </div>

    <div class="p-4 border-t border-blue-100 bg-blue-50/30">
        <div class="text-[11px] text-blue-900 font-bold">Ban Điều Hành KizunaTutor</div>
        <div class="text-[10px] text-slate-500">Giám sát 42 lớp học trực tuyến</div>
    </div>
</aside>
</html>
